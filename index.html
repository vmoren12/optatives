<html lang="ca">

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" integrity="sha512-r22gChDnGvBylk90+2e/ycr3RVrDi8DIOkIGNhJlKfuyQM4tIRAI062MaV8sfjQKYVGjOBaZBOA87z+IhZE9DA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
:root{
  /* Layout: barra superior fixa, carril de passos a l'esquerra, àrea de treball amb scroll; fitxa d'alumne lliscant per la dreta */
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#F7F8FA; --ink:#121A28; --muted:#566173; --faint:#8791A1;
  --line:#D9DFE7; --line-2:#E9EDF2;
  --accent:#184F95; --accent-ink:#FFFFFF; --accent-soft:#E6EEF9;
  --ok:#1B7646; --ok-soft:#E1F1E7; --warn:#935600; --warn-soft:#FBEED6; --bad:#B42318; --bad-soft:#FBE5E2;
  --rk1:#184f95; --rk2:#1c5cab; --rk3:#256abf; --rk4:#2a78d6; --rk5:#3987e5; --rk6:#5598e7; --rk7:#6da7ec; --rk8:#86b6ef;
  --rk1i:#fff; --rk2i:#fff; --rk3i:#fff; --rk4i:#fff; --rk5i:#fff; --rk6i:#0b1a33; --rk7i:#0b1a33; --rk8i:#0b1a33;
  --out:#ec835a; --outi:#3a1606; --none:#d03b3b; --nonei:#fff;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#6250d6; --c8:#e34948;
  --font-ui:"Hanken Grotesk","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(18,26,40,.05),0 8px 28px rgba(18,26,40,.10);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E131B; --surface:#151C27; --surface-2:#1A2230; --ink:#E6EBF2; --muted:#A2ACBB; --faint:#748093;
    --line:#2A3445; --line-2:#212A38;
    --accent:#86B6EF; --accent-ink:#0B1626; --accent-soft:#1D2B44;
    --ok:#5CC48F; --ok-soft:#14301F; --warn:#E9AA4C; --warn-soft:#33260E; --bad:#F07C6E; --bad-soft:#3A1A17;
    --rk1:#b7d3f6; --rk2:#9ec5f4; --rk3:#86b6ef; --rk4:#6da7ec; --rk5:#5598e7; --rk6:#3987e5; --rk7:#2a78d6; --rk8:#1c5cab;
    --rk1i:#0b1a33; --rk2i:#0b1a33; --rk3i:#0b1a33; --rk4i:#0b1a33; --rk5i:#0b1a33; --rk6i:#fff; --rk7i:#fff; --rk8i:#fff;
    --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#0ca30c; --c7:#9085e9; --c8:#e66767;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E131B; --surface:#151C27; --surface-2:#1A2230; --ink:#E6EBF2; --muted:#A2ACBB; --faint:#748093;
  --line:#2A3445; --line-2:#212A38;
  --accent:#86B6EF; --accent-ink:#0B1626; --accent-soft:#1D2B44;
  --ok:#5CC48F; --ok-soft:#14301F; --warn:#E9AA4C; --warn-soft:#33260E; --bad:#F07C6E; --bad-soft:#3A1A17;
  --rk1:#b7d3f6; --rk2:#9ec5f4; --rk3:#86b6ef; --rk4:#6da7ec; --rk5:#5598e7; --rk6:#3987e5; --rk7:#2a78d6; --rk8:#1c5cab;
  --rk1i:#0b1a33; --rk2i:#0b1a33; --rk3i:#0b1a33; --rk4i:#0b1a33; --rk5i:#0b1a33; --rk6i:#fff; --rk7i:#fff; --rk8i:#fff;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#0ca30c; --c7:#9085e9; --c8:#e66767;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font-ui);-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:650;letter-spacing:-.01em}
h1{font-size:24px;line-height:1.2}
h2{font-size:16px}
h3{font-size:14px}
p{margin:0}
a{color:var(--accent)}
.lead{color:var(--muted);max-width:70ch;margin-top:6px}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.small{font-size:12.5px}
.mono,.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.ic{width:16px;height:16px;flex:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);grid-template-rows:56px minmax(0,1fr);height:100%}
.top{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--surface);border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;white-space:nowrap}
.brand-mark{width:26px;height:26px;border-radius:6px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.proj{flex:1;min-width:80px;max-width:340px;height:32px;border:1px solid transparent;background:transparent;border-radius:6px;padding:0 8px;color:var(--muted)}
.proj:hover,.proj:focus{border-color:var(--line);background:var(--surface-2);outline:none;color:var(--ink)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:6px}
.saved{font-size:12px;color:var(--faint);margin-right:6px;white-space:nowrap}
.steps{background:var(--surface);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.step{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;text-decoration:none;color:var(--ink)}
.step:hover{background:var(--surface-2)}
.step .n{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:650;color:var(--muted)}
.step.done .n{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.step.on{background:var(--accent-soft)}
.step.on .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step .l{font-weight:600;line-height:1.2}
.step .s{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
.flag{min-width:20px;height:20px;padding:0 6px;border-radius:10px;font-size:11.5px;font-weight:700;display:grid;place-items:center}
.flag.bad{background:var(--bad-soft);color:var(--bad)}
.flag.warn{background:var(--warn-soft);color:var(--warn)}
.steps-foot{margin-top:auto;padding:12px 10px 28px;font-size:12px;color:var(--faint);line-height:1.5}
main{overflow:auto;padding:28px 32px 72px;min-width:0;scroll-padding-bottom:30px}
.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
@media (max-width:880px){
  .app{grid-template-columns:1fr;grid-template-rows:56px auto minmax(0,1fr)}
  .steps{flex-direction:row;border-right:0;border-bottom:1px solid var(--line);padding:6px 8px;overflow-x:auto}
  .step{grid-template-columns:24px auto auto;padding:6px 8px;white-space:nowrap}
  .step .s,.steps-foot,.saved{display:none}
  main{padding:20px 16px 56px}
  .proj{display:none}
}

/* elements */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border:1px solid var(--line);background:var(--surface);border-radius:7px;cursor:pointer;font-weight:550;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn.icon{padding:0;width:34px}
.btn.sm.icon{width:30px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.in{height:34px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0 10px;min-width:0}
textarea.in{height:auto;padding:8px 10px;resize:vertical}
.in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.in.n{width:76px;text-align:right;font-family:var(--font-num)}
.in.w-s{width:64px}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.card-h p{color:var(--muted);font-size:13px;margin-top:2px}
.card-b{padding:16px 18px}
.card-b.tight{padding:0}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.field{display:flex;flex-direction:column;gap:5px}
.field>label,.lbl{font-size:12.5px;font-weight:600;color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted);border:1px solid var(--line-2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill .ic{width:13px;height:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface);flex:none}
.seg button{border:0;background:transparent;height:32px;padding:0 12px;cursor:pointer;color:var(--muted);font-weight:550;border-right:1px solid var(--line);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.seg.sm button{height:28px;padding:0 10px;font-size:13px}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.tbl td{padding:8px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.tbl tr.off td{opacity:.5}
.tbl tr.off td:first-child{opacity:1}
.tbl th.sortable{cursor:pointer}
.tbl th.sortable:hover{color:var(--ink)}
.empty{padding:40px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:12px}
.empty h2{color:var(--ink)}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line-2);color:var(--muted);font-size:13px}
.note.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.note.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.note.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.note .ic{margin-top:2px}

/* data */
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:44px 20px;border:1.5px dashed var(--line);border-radius:12px;background:var(--surface);cursor:pointer;text-align:center;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .ic{width:28px;height:28px;color:var(--accent)}
.drop strong{font-size:15px}
.drop span{color:var(--muted);font-size:13px}
.ex-tbl{font-size:12.5px}
.ex-tbl td,.ex-tbl th{padding:6px 10px}
.ex-tbl td{color:var(--muted)}
.map-row{display:grid;grid-template-columns:44px minmax(140px,1.1fr) minmax(160px,1.6fr) 230px;gap:12px;align-items:center;padding:9px 18px;border-bottom:1px solid var(--line-2)}
.map-row:last-child{border-bottom:0}
.map-row.head-r{font-size:12px;font-weight:600;color:var(--muted);background:var(--surface-2)}
.col-l{font-family:var(--font-num);font-size:12px;color:var(--faint)}
.map-h{font-weight:600;word-break:break-word}
.map-ex{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.map-row.used{background:color-mix(in srgb,var(--accent-soft) 40%,transparent)}
.map-row select{width:100%}
@media (max-width:700px){.map-row{grid-template-columns:36px 1fr;}.map-ex{grid-column:2}.map-row select{grid-column:2}.map-row.head-r{display:none}}
.role-tag{font-size:11px;font-weight:600;color:var(--accent);display:block;margin-bottom:2px;text-transform:uppercase;letter-spacing:.04em}

/* issues */
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line-2)}
.sumgrid>div{background:var(--surface);padding:14px 18px}
.sumgrid .v{font-size:22px;font-weight:650;font-family:var(--font-num)}
.sumgrid .k{font-size:12.5px;color:var(--muted)}
.dist{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.dist span{font-size:12.5px;padding:2px 8px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line-2)}
.dist span b{font-family:var(--font-num);font-weight:500;margin-left:4px}
.issue{display:grid;grid-template-columns:4px 1fr auto;gap:0 14px;border:1px solid var(--line);border-radius:9px;background:var(--surface);overflow:hidden}
.issue .stripe{background:var(--line)}
.issue.lv-error .stripe{background:var(--bad)}
.issue.lv-warn .stripe{background:var(--warn)}
.issue.lv-info .stripe{background:var(--accent)}
.issue .im{padding:12px 0;min-width:0}
.issue .it{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:600}
.issue .cat{font-size:12px;color:var(--faint);font-weight:500}
.issue .id{color:var(--muted);font-size:13px;margin-top:4px}
.issue .ia{display:flex;gap:6px;align-items:center;padding:10px 12px 10px 0;flex-wrap:wrap;justify-content:flex-end;max-width:420px}
.issue.dismissed{opacity:.55}
@media (max-width:700px){.issue{grid-template-columns:4px 1fr}.issue .ia{grid-column:2;justify-content:flex-start;padding:0 12px 12px 0}}

/* rank badges & chips */
.rk{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 4px;border-radius:5px;font-size:11.5px;font-weight:700;font-family:var(--font-num);flex:none}
.rk1{background:var(--rk1);color:var(--rk1i)}.rk2{background:var(--rk2);color:var(--rk2i)}.rk3{background:var(--rk3);color:var(--rk3i)}.rk4{background:var(--rk4);color:var(--rk4i)}
.rk5{background:var(--rk5);color:var(--rk5i)}.rk6{background:var(--rk6);color:var(--rk6i)}.rk7{background:var(--rk7);color:var(--rk7i)}.rk8{background:var(--rk8);color:var(--rk8i)}
.rk-out{background:var(--out);color:var(--outi)}
.rk-none{background:var(--none);color:var(--nonei)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);align-items:center}
.legend>span{display:inline-flex;align-items:center;gap:6px}
.chip{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface);cursor:grab;user-select:none;min-width:0}
.chip:hover{border-color:var(--faint)}
.chip .nm{flex:1;min-width:0;overflow-wrap:anywhere;line-height:1.25}
.chip .gp{font-size:11.5px;color:var(--faint);white-space:nowrap}
.chip .ic{width:13px;height:13px;color:var(--faint)}
.chip.viol{border-color:var(--bad);box-shadow:inset 3px 0 0 var(--bad)}
.chip.dragging{opacity:.4}
.mchip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 4px 0 9px;border-radius:13px;background:var(--surface-2);border:1px solid var(--line);font-size:13px}
.mchip button{border:0;background:transparent;width:20px;height:20px;border-radius:50%;cursor:pointer;display:grid;place-items:center;color:var(--muted)}
.mchip button:hover{background:var(--line)}
.mchip button.link{width:auto;height:auto;border-radius:0;display:inline;padding:0 4px 0 0}
.mchip button.link:hover{background:none}
.mchip.bad{border-color:var(--bad);background:var(--bad-soft)}
.tc{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:1px 7px 1px 3px;border-radius:5px;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
.tc i{font-style:normal;font-family:var(--font-num);font-size:11px;color:var(--faint);min-width:12px;text-align:center}
.tc.on{border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}
.tc.off{text-decoration:line-through;opacity:.6}
.tcs{display:flex;flex-wrap:wrap;gap:4px}

/* board */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;align-items:start}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-width:0;transition:border-color .12s,box-shadow .12s}
.scard.over{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.scard.unas{border-style:dashed}
.sc-h{padding:12px 14px 10px;border-bottom:1px solid var(--line-2);display:flex;flex-direction:column;gap:7px}
.sc-t{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sc-t h3{overflow-wrap:anywhere}
.sc-c{font-family:var(--font-num);font-size:13px;white-space:nowrap}
.sc-b{padding:8px;display:flex;flex-direction:column;gap:4px;max-height:420px;overflow:auto;min-height:48px}
.sc-empty{color:var(--faint);font-size:12.5px;text-align:center;padding:10px}
.bar{position:relative;height:6px;border-radius:3px;background:var(--line-2);overflow:visible}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--accent)}
.bar>i.full{background:var(--ok)}
.bar>i.over{background:var(--bad)}

function normSettings(st){
  st=st&&typeof st==='object'?st:{};
  const s=Object.assign(defaultSettings(),st);
  if(st.periods==null)s.periods=+st.perStudent>1?Math.min(3,+st.perStudent):1;
  s.periods=Math.max(1,Math.min(3,Math.floor(+s.periods)||1));
  delete s.perStudent;
  if(!Array.isArray(s.costs)||!s.costs.length)s.costs=STRATS.primeres.costs.slice();
  s.costs=s.costs.map(x=>Math.max(0,+x||0));s.costs[0]=0;
  if(!STRATS[s.strategy]&&s.strategy!=='custom')s.strategy='custom';
  if(!s.balance||typeof s.balance!=='object')s.balance={};
  if(st.softLevel==null&&st.softW!=null){const step=Math.max(5,(+s.costs[1]||10)-(+s.costs[0]||0));const r=(+st.softW||0)/step;s.softLevel=r<1?1:r<3?2:3;}
  s.softLevel=[1,2,3].includes(+s.softLevel)?+s.softLevel:2;
  s.intensity='exhaustiva';
  return s;
}

  S2.criteria=Array.isArray(S2.criteria)?S2.criteria.filter(c=>c&&c.key):[];
  S2.constraints=(Array.isArray(S2.constraints)?S2.constraints:[]).filter(c=>c&&Array.isArray(c.members)).map(c=>({id:c.id||uid(),type:c.type==='sep'?'sep':'join',strength:c.strength==='soft'?'soft':'hard',members:c.members,source:c.source||'Manual',note:c.note||''}));
  S2.issues=Array.isArray(S2.issues)?S2.issues:[];
  const asg={};Object.entries(S2.asg&&typeof S2.asg==='object'?S2.asg:{}).forEach(([k,v])=>{if(Array.isArray(v))asg[k]=v.map(x=>x||null);else if(typeof v==='string')asg[k]=[v];});S2.asg=asg;
  S2.locked=S2.locked&&typeof S2.locked==='object'?S2.locked:{};
  return S2;
}
function softLevel(){return[1,2,3].includes(+S.settings.softLevel)?+S.settings.softLevel:2;}
function softWeight(){const step=Math.max(5,costAt(1)-costAt(0));return[0,.5,1.5,4][softLevel()]*step;}
function costAt(r){const c=S.settings.costs;if(r<c.length)return +c[r]||0;const last=+c[c.length-1]||0,prev=+c[c.length-2]||0;return last+(last-prev)*(r-c.length+1);}
function maxChoices(){let m=0;S.students.forEach(s=>{if(s.choices.length>m)m=s.choices.length;});return m;}
function suggestCap(){const j=activeSubs().length||S.subjects.length||1;return Math.max(5,Math.ceil(S.students.length/j*1.15));}

async function readWorkbook(file){
  if(!window.XLSX)throw new Error('no s’ha pogut carregar el lector d’Excel (comprova la connexió)');
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  let wb;
  if(ext==='csv'||ext==='tsv'){const txt=await file.text();wb=XLSX.read(txt,{type:'string',FS:ext==='tsv'?'\t':undefined});}
  else{const buf=await file.arrayBuffer();wb=XLSX.read(buf,{type:'array',cellDates:true});}
  const sheets={};
  wb.SheetNames.forEach(n=>{const ws=wb.Sheets[n];sheets[n]=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false,blankrows:true}).map(r=>(r||[]).map(c=>clean(c)));});
  return{name:file.name,order:wb.SheetNames.slice(),sheets};
}
const isConsSheet=n=>/ajunt|separ|restric|compat|incompat|junt/i.test(norm(n));
const nonEmpty=rows=>rows.filter(r=>r.some(c=>c)).length;
const width=rows=>rows.reduce((m,r)=>Math.max(m,r.length),0);
function guessRole(h){
  const n=norm(h);
  if(!n)return'ignorar';
  if(/incompatib|separa|no amb|no junt|evitar|lluny/.test(n))return'separar';
  if(/ajunt|juntar|junts|compatib|agrupa|amb qui|amics?\b/.test(n))return'ajuntar';
  if(/cognom|apellido|surname|last name/.test(n)&&!/^nom/.test(n))return'cognoms';
  if(/^(nom|nombre|name|alumne|alumna|alumnat|estudiant|first name)\b/.test(n))return'nom';
  if(/(tria|opcio|optativa|preferencia|prioritat|eleccio|choice|materia|assignatura|optional)/.test(n)||/^\d+$/.test(n))return'tria';
  if(/escolet|escola|procedenc|origen|primaria/.test(n))return'escoleta';
  if(/genere|sexe|\bsex\b|gender/.test(n))return'genere';
  if(/nivell|nivel|rendiment|level|nota mitjana/.test(n))return'nivell';
  if(/^(grup|grupo|classe|clase|group|curs|aula|tutoria)\b/.test(n))return'grup';
  return'ignorar';
}
function detectHeader(rows){
  let best=0,bs=-1;
  for(let r=0;r<Math.min(rows.length,15);r++){
    const cells=(rows[r]||[]).filter(Boolean);
    if(cells.length<2)continue;
    const sc=cells.filter(c=>guessRole(c)!=='ignorar').length*3+cells.length*.05;
    if(sc>bs){bs=sc;best=r;}
  }
  if(bs<3){const f=rows.findIndex(r=>r.some(Boolean));return f<0?0:f;}
  return best;
}
function guessRoles(rows,hr){
  const hdr=rows[hr]||[],w=width(rows);
  const roles=[];const seen={};
  for(let i=0;i<w;i++){let r=guessRole(hdr[i]);if(['grup','escoleta','genere','nivell','nom','cognoms'].includes(r)){if(seen[r])r='ignorar';seen[r]=1;}roles.push(r);}
  if(!roles.includes('nom')&&!roles.includes('cognoms')){
    // primera columna amb text majoritàriament únic
    for(let i=0;i<w;i++){if(roles[i]!=='ignorar')continue;const vals=rows.slice(hr+1).map(r=>r[i]).filter(Boolean);if(vals.length>2&&new Set(vals).size>vals.length*.9&&vals.every(v=>!/^\d+([.,]\d+)?$/.test(v))){roles[i]='nom';break;}}
  }
  return roles;
}
function triaCols(){
  const R=S.map.roles,hdr=(S.file.sheets[S.map.sheet]||[])[S.map.headerRow]||[];
  const cs=R.map((r,i)=>r==='tria'?i:-1).filter(i=>i>=0);
  const num=i=>{const m=String(hdr[i]||'').match(/\d+/);return m?+m[0]:Infinity;};
  const allNum=cs.every(i=>num(i)!==Infinity)&&new Set(cs.map(num)).size===cs.length;
  return allNum?cs.slice().sort((a,b)=>num(a)-num(b)):cs;
}
function setSheet(name){
  const rows=S.file.sheets[name]||[];const hr=detectHeader(rows);
  S.map={sheet:name,headerRow:hr,roles:guessRoles(rows,hr)};
}
async function onMainFile(file){
  if(!file)return;
  try{
    const wb=await readWorkbook(file);
    S.file=wb;
    const main=wb.order.find(n=>!isConsSheet(n)&&nonEmpty(wb.sheets[n])>1)||wb.order[0];

    toast('Fitxer carregat. Revisa com s’interpreta cada columna i aplica.');
  }catch(e){toast('No s’ha pogut llegir el fitxer: '+e.message,'bad');}
}

/* ============================================================
   Aplicar la correspondència de columnes
   ============================================================ */
function applyMapping(){
  const rows=S.file.sheets[S.map.sheet]||[],hr=S.map.headerRow,R=S.map.roles,hdr=rows[hr]||[];
  const cols=r=>R.map((x,i)=>x===r?i:-1).filter(i=>i>=0);
  const nomC=cols('nom'),cogC=cols('cognoms'),tC=triaCols();
  if(!nomC.length&&!cogC.length){toast('Indica quina columna conté el nom de l’alumne.','bad');return false;}
  if(!tC.length){toast('Indica almenys una columna de tries.','bad');return false;}
  const prevSubs=new Map(S.subjects.map(s=>[norm(s.name),s]));
  const prevManual=S.constraints.filter(c=>c.source==='Manual').map(c=>({...c,names:c.members.map(id=>byId(id)?.name).filter(Boolean)}));
  const issues=[];const add=o=>issues.push(Object.assign({id:uid(),level:'warn',cat:'Alumnes',fixes:[]},o));
  const crit=[];
  ['grup','escoleta','genere','nivell'].forEach(k=>{const c=cols(k);if(c.length)crit.push({key:k,label:CRIT_L[k],col:c[0]});});
  cols('altre').forEach(c=>crit.push({key:'x'+c,label:hdr[c]||('Columna '+colL(c)),col:c}));
  const jC=cols('ajuntar'),sC=cols('separar');
  const subjV=new Map();const studs=[];
  let empty=0,repHdr=0;const gaps=[],dupCh=[],noCh=[],noName=[];
  const hdrN=hdr.map(norm).join('|');
  for(let r=hr+1;r<rows.length;r++){
    const row=rows[r]||[];
    if(!row.some(Boolean)){empty++;continue;}
    if(row.map(norm).join('|')===hdrN){repHdr++;continue;}
    const first=nomC.map(c=>clean(row[c])).filter(Boolean).join(' ');
    const last=cogC.map(c=>clean(row[c])).filter(Boolean).join(' ');
    let name=[first,last].filter(Boolean).join(' ');
    const rowN=r+1;
    const raw=tC.map(c=>clean(row[c]));
    if(!name){if(!raw.some(Boolean)){empty++;continue;}name='Sense nom (fila '+rowN+')';noName.push(rowN);}
    let seenE=false,gap=false;raw.forEach(v=>{if(!v)seenE=true;else if(seenE)gap=true;});
    if(gap)gaps.push(rowN);
    const keys=[];let dup=false;
    raw.forEach(v=>{if(!v)return;const k=norm(v);if(!k)return;if(keys.includes(k)){dup=true;return;}keys.push(k);const m=subjV.get(k)||new Map();m.set(v,(m.get(v)||0)+1);subjV.set(k,m);});
    if(dup)dupCh.push(rowN);
    if(!keys.length)noCh.push(rowN);
    const attrs={};crit.forEach(c=>attrs[c.key]=clean(row[c.col]));
    studs.push({id:uid(),name,first,last,row:rowN,keys,attrs,jr:jC.map(c=>row[c]).filter(x=>clean(x)),sr:sC.map(c=>row[c]).filter(x=>clean(x))});
  }
  if(!studs.length){toast('No s’ha trobat cap alumne a partir de la fila de capçalera indicada.','bad');return false;}
  // matèries
  const subjects=[],k2id=new Map();
  [...subjV.entries()].forEach(([k,m])=>{
    const vars=[...m.entries()].sort((a,b)=>b[1]-a[1]);
    const name=vars[0][0];const p=prevSubs.get(k);
    const s=p?{...p}:{id:uid(),name,cap:null,min:0,trims:[true,true,true],active:true};
    subjects.push(s);k2id.set(k,s.id);
    if(vars.length>1)add({level:'info',cat:'Matèries',title:`S’han unificat ${vars.length} formes d’escriure «${name}»`,detail:vars.map(([v,c])=>`«${v}» (${c})`).join(', ')+'. Només difereixen en majúscules, accents o espais.'});
  });
  studs.forEach(s=>{s.choices=s.keys.map(k=>k2id.get(k));delete s.keys;});
  const ment={};studs.forEach(s=>s.choices.forEach(id=>ment[id]=(ment[id]||0)+1));
  subjects.sort((a,b)=>(ment[b.id]||0)-(ment[a.id]||0));
  // matèries semblants
  for(let a=0;a<subjects.length;a++)for(let b=a+1;b<subjects.length;b++){
    const A=subjects[a],B=subjects[b],na=norm(A.name),nb=norm(B.name);
    const close=(Math.min(na.length,nb.length)>=4&&sim(na,nb)>=.8)||na.replace(/\s/g,'')===nb.replace(/\s/g,'');
    if(close)add({level:'warn',cat:'Matèries',title:`«${A.name}» i «${B.name}» podrien ser la mateixa matèria`,detail:`${pl(ment[A.id]||0,'menció','mencions')} i ${pl(ment[B.id]||0,'menció','mencions')}. Si és un error d’escriptura, unifica-les.`,fixes:[{label:`Unificar a «${A.name}»`,kind:'mergeSubj',args:[B.id,A.id]},{label:`Unificar a «${B.name}»`,kind:'mergeSubj',args:[A.id,B.id]}]});
  }
  if(subjects.length>20)add({level:'warn',cat:'Matèries',title:`S’han detectat ${subjects.length} matèries diferents`,detail:'És un nombre alt. Revisa si hi ha noms escrits de maneres diferents o columnes que no són tries.'});
  // alumnes
  const byN=new Map();studs.forEach(s=>{const k=norm(s.name);byN.set(k,[...(byN.get(k)||[]),s]);});
  byN.forEach(list=>{if(list.length>1)add({level:'warn',cat:'Alumnes',title:`Nom repetit: «${list[0].name}»`,detail:`Apareix ${list.length} vegades. Si són alumnes diferents, afegeix un segon cognom o una inicial perquè no es confonguin a les restriccions.`,rows:list.map(s=>s.row)});});
  if(noName.length)add({level:'warn',title:`${pl(noName.length,'fila té','files tenen')} tries però cap nom`,detail:'S’han inclòs com a «Sense nom». Completa el nom a l’Excel i torna’l a carregar.',rows:noName});
  if(noCh.length)add({level:'warn',title:`${pl(noCh.length,'alumne no té','alumnes no tenen')} cap tria`,detail:S.settings.allowOutside?'Se’ls assignarà una matèria amb places lliures.':'Quedaran sense assignar si no permets matèries no triades (pas Criteris).',rows:noCh});
  if(dupCh.length)add({level:'warn',title:`${pl(dupCh.length,'alumne repeteix','alumnes repeteixen')} una matèria a les tries`,detail:'S’ha conservat la primera aparició i les tries següents han pujat de posició.',rows:dupCh});
  if(gaps.length)add({level:'info',title:`${pl(gaps.length,'alumne té','alumnes tenen')} tries buides entre mig`,detail:'Les tries s’han compactat per ordre (per exemple, una tercera tria amb la segona buida passa a ser la segona).',rows:gaps});
  if(empty)add({level:'info',cat:'Fitxer',title:empty===1?'S’ha ignorat 1 fila buida':`S’han ignorat ${empty} files buides`});
  if(repHdr)add({level:'info',cat:'Fitxer',title:repHdr===1?'S’ha ignorat 1 fila que repeteix la capçalera':`S’han ignorat ${repHdr} files que repeteixen la capçalera`});
  const fewC=studs.filter(s=>s.choices.length&&s.choices.length<Math.min(3,tC.length));
  if(fewC.length&&tC.length>=3)add({level:'info',title:`${pl(fewC.length,'alumne ha fet','alumnes han fet')} menys de 3 tries`,detail:'Si les seves opcions s’omplen, tindran menys alternatives.',rows:fewC.map(s=>s.row)});
  // criteris
  crit.forEach(c=>{
    const g=new Map();let emp=[];
    studs.forEach(s=>{const v=s.attrs[c.key];if(!v){emp.push(s.row);return;}const k=norm(v);const m=g.get(k)||new Map();m.set(v,(m.get(v)||0)+1);g.set(k,m);});
    const disp=new Map();
    g.forEach((m,k)=>{const vars=[...m.entries()].sort((a,b)=>b[1]-a[1]);disp.set(k,vars[0][0]);if(vars.length>1)add({level:'info',cat:'Criteris',title:`${c.label}: s’han unificat ${vars.map(v=>'«'+v[0]+'»').join(', ')}`});});
    studs.forEach(s=>{const v=s.attrs[c.key];if(v)s.attrs[c.key]=disp.get(norm(v));});
    const counts=[...g.entries()].map(([k,m])=>[disp.get(k),[...m.values()].reduce((a,b)=>a+b,0)]).sort((a,b)=>b[1]-a[1]);
    if(emp.length&&emp.length<studs.length)add({level:'info',cat:'Criteris',title:`${pl(emp.length,'alumne','alumnes')} sense valor a «${c.label}»`,detail:'No es tindran en compte per equilibrar aquest criteri.',rows:emp});
    if(counts.length>Math.max(12,studs.length*.5))add({level:'warn',cat:'Criteris',title:`La columna «${c.label}» té ${counts.length} valors diferents`,detail:'Gairebé cada alumne té un valor propi, de manera que no serveix per equilibrar. Comprova que és la columna correcta.'});
    else if(counts.length>=2){
      const top=counts[0][1];
      counts.forEach(([v,n])=>{if(n<=Math.max(1,Math.round(studs.length*.03))&&top>=n*5){const alt=counts.filter(x=>x[0]!==v).slice(0,2);add({level:'warn',cat:'Criteris',title:`Valor poc freqüent a «${c.label}»: «${v}»`,detail:`Només ${pl(n,'alumne','alumnes')}. Pot ser una variant d’un altre valor.`,rows:studs.filter(s=>s.attrs[c.key]===v).map(s=>s.row),fixes:alt.map(a=>({label:`Canviar per «${a[0]}»`,kind:'mergeAttr',args:[c.key,v,a[0]]}))});}});
    }
  });
  // aplicar
  S.students=studs;S.subjects=subjects;S.criteria=crit.map(({key,label})=>({key,label}));
  const dc=suggestCapFor(studs.length,subjects.length);
  S.subjects.forEach(s=>{if(s.cap==null||s.cap==='')s.cap=dc;});
  S.criteria.forEach(c=>{if(S.settings.balance[c.key]==null)S.settings.balance[c.key]=0;});
  reindex();
  // restriccions de l'Excel
  const cons=resolveRefs(studs.map(s=>({sid:s.id,row:s.row,jr:s.jr,sr:s.sr})),'Excel',add);
  studs.forEach(s=>{delete s.jr;delete s.sr;});
  // restriccions manuals anteriors (per nom)
  const nIdx=new Map(studs.map(s=>[norm(s.name),s.id]));
  prevManual.forEach(c=>{const mem=c.names.map(n=>nIdx.get(norm(n))).filter(Boolean);if(mem.length>=2)cons.push({id:c.id,type:c.type,strength:c.strength,members:mem,source:'Manual',note:c.note||''});});
  S.constraints=dedupeCons(cons);
  S.issues=issues;S.asg={};S.locked={};HIST=[];FUT=[];S.applied=true;S.lastRun=null;
  persist();
  return true;
}
function suggestCapFor(n,j){return Math.max(5,Math.ceil(n/(j||1)*1.15));}
function dedupeCons(list){const seen=new Set();return list.filter(c=>{const k=c.type+':'+c.members.slice().sort().join(',');if(seen.has(k))return false;seen.add(k);return true;});}

/* resolució de noms a les columnes d'ajuntar/separar */
function nameIndex(){
  const idx=new Map();const put=(k,id)=>{if(!k)return;const a=idx.get(k)||[];if(!a.includes(id))a.push(id);idx.set(k,a);};
  S.students.forEach(s=>{s._n=norm(s.name);put(s._n,s.id);if(s.first&&s.last){put(norm(s.last+' '+s.first),s.id);}});
  return idx;
}
function resolveName(k,idx){
  const ex=idx.get(k);if(ex)return{how:'exact',ids:ex};
  if(k.length>=3){const c=S.students.filter(s=>(' '+s._n+' ').includes(' '+k+' '));if(c.length)return{how:'partial',ids:c.map(s=>s.id)};}
  let best=0,bid=null;S.students.forEach(s=>{const r=Math.max(sim(k,s._n),s.first&&s.last?sim(k,norm(s.last+' '+s.first)):0);if(r>best){best=r;bid=s.id;}});
  if(best>=.85)return{how:'fuzzy',ids:[bid],score:best};
  return{how:'none',ids:[],sug:best>=.55?bid:null};
}
function splitCell(cell,idx){
  const c=clean(cell);if(!c)return[];
  if(idx.has(norm(c)))return[c];
  const out=[];
  c.split(/\s*[;|\n\/]\s*/).forEach(p=>{if(!p)return;
    if(p.includes(',')){const parts=p.split(',');const rev=(parts.slice(1).join(' ')+' '+parts[0]).trim();if(idx.has(norm(rev))){out.push(rev);return;}if(idx.has(norm(p.replace(/,/g,' ')))){out.push(p.replace(/,/g,' '));return;}p.split(/\s*,\s*/).forEach(x=>x&&out.push(x));}
    else out.push(p);
  });
  return out;
}
function resolveRefs(entries,source,add){
  const idx=nameIndex();const out=[];
  const strength=t=>t==='join'?S.settings.joinDefault:S.settings.sepDefault;
  const tl=t=>t==='join'?'Ajuntar':'Separar';
  ['join','sep'].forEach(type=>{
    const field=type==='join'?'jr':'sr';
    const occ=new Map();
    entries.forEach(e=>(e[field]||[]).forEach(cell=>splitCell(cell,idx).forEach(v=>{const k=norm(v);if(!k)return;const a=occ.get(k)||[];a.push({sid:e.sid,raw:v,row:e.row});occ.set(k,a);})));
    const pairs=[],labels=[];
    occ.forEach((list,k)=>{
      const sids=[...new Set(list.map(x=>x.sid))];
      const res0=resolveName(k,idx);
      if(res0.how!=='exact'&&res0.how!=='fuzzy'&&!(res0.how==='partial'&&res0.ids.length===1)&&sids.length>=2){labels.push({raw:list[0].raw,sids});return;}
      list.forEach(({sid,raw,row})=>{
        const me=byId(sid);const res=res0;
        if(res.how==='none'){
          const sg=res.sug?byId(res.sug):null;
          add({level:'warn',cat:'Restriccions',title:`«${raw}» no correspon a cap alumne`,detail:`Columna ${tl(type)} de ${me.name} (fila ${row}). Tampoc és un codi compartit amb altres alumnes.`+(sg?` Potser vols dir «${sg.name}».`:''),fixes:sg?[{label:`Vincular amb «${sg.name}»`,kind:'linkPair',args:[type,sid,sg.id]}]:[]});
          return;
        }
        const ids=res.ids.filter(x=>x!==sid);
        if(res.ids.length===1&&res.ids[0]===sid){add({level:'warn',cat:'Restriccions',title:`${me.name} fa referència a si mateix`,detail:`Columna ${tl(type)} (fila ${row}). S’ha ignorat.`});return;}
        if(ids.length>1){add({level:'warn',cat:'Restriccions',title:`«${raw}» coincideix amb ${ids.length} alumnes`,detail:`Columna ${tl(type)} de ${me.name} (fila ${row}). Escriu el nom complet o tria quin és.`,fixes:ids.slice(0,4).map(id=>({label:`Vincular amb «${byId(id).name}»`,kind:'linkPair',args:[type,sid,id]}))});return;}
        const other=ids[0];if(!other)return;
        pairs.push([sid,other]);
        if(res.how==='fuzzy')add({level:'warn',cat:'Restriccions',title:`«${raw}» s’ha interpretat com «${byId(other).name}»`,detail:`Columna ${tl(type)} de ${me.name} (fila ${row}). El nom no és idèntic; comprova que és la persona correcta.`,fixes:[{label:'No és correcte, desfer el vincle',kind:'unlinkPair',args:[type,sid,other]}]});
        else if(res.how==='partial')add({level:'info',cat:'Restriccions',title:`«${raw}» s’ha interpretat com «${byId(other).name}»`,detail:`Columna ${tl(type)} de ${me.name} (fila ${row}). Coincidència parcial i única.`});
      });
    });
    if(type==='join'){
      const par=new Map();const f=x=>{while(par.get(x)!==x){par.set(x,par.get(par.get(x)));x=par.get(x);}return x;};
      pairs.forEach(([a,b])=>{if(!par.has(a))par.set(a,a);if(!par.has(b))par.set(b,b);par.set(f(a),f(b));});
      const comp=new Map();[...par.keys()].forEach(x=>{const r=f(x);comp.set(r,[...(comp.get(r)||[]),x]);});
      comp.forEach(m=>{if(m.length>=2)out.push({id:uid(),type,strength:strength(type),members:m,source,note:''});});
    }else pairs.forEach(p=>out.push({id:uid(),type,strength:strength(type),members:p,source,note:''}));
    labels.forEach(l=>{out.push({id:uid(),type,strength:strength(type),members:l.sids,source,note:`Codi «${l.raw}»`});add({level:'info',cat:'Restriccions',title:`Codi «${l.raw}»: ${l.sids.length} alumnes per ${type==='join'?'ajuntar':'separar'}`,detail:l.sids.map(id=>byId(id).name).join(', ')});});
  });
  return out;
}

function mergeSubjects(from,to){
  if(from===to)return;
  S.students.forEach(s=>{const c=[];s.choices.forEach(id=>{const x=id===from?to:id;if(!c.includes(x))c.push(x);});s.choices=c;});
  Object.keys(S.asg).forEach(k=>{const c=[];(S.asg[k]||[]).forEach(id=>{const x=id===from?to:id;c.push(x&&c.includes(x)?null:x);});S.asg[k]=c;});
  S.subjects=S.subjects.filter(s=>s.id!==from);
  S.issues.forEach(i=>{if((i.fixes||[]).some(f=>f.kind==='mergeSubj'&&(f.args.includes(from))))i.resolved=true;});
}
function addConstraint(type,members,source,strength,note){
  const c={id:uid(),type,strength:strength||(type==='join'?S.settings.joinDefault:S.settings.sepDefault),members:[...new Set(members)],source,note:note||''};
  if(type==='join'){const ex=S.constraints.find(g=>g.type==='join'&&g.source===source&&g.members.some(m=>c.members.includes(m)));if(ex){ex.members=[...new Set([...ex.members,...c.members])];return ex;}}
  S.constraints.push(c);S.constraints=dedupeCons(S.constraints);return c;
}
const FIX={
  mergeSubj(from,to){mergeSubjects(from,to);},
  linkPair(type,a,b){addConstraint(type,[a,b],'Excel');},
  unlinkPair(type,a,b){S.constraints.forEach(g=>{if(g.type===type&&g.members.includes(a)&&g.members.includes(b)){g.members=g.members.filter(x=>x!==b);}});S.constraints=S.constraints.filter(g=>g.members.length>=2);},
  mergeAttr(key,from,to){S.students.forEach(s=>{if(s.attrs[key]===from)s.attrs[key]=to;});},
  fitCaps(){const N=periods();const n=S.students.length;for(let k=0;k<N;k++){const subs=activeSubs().filter(s=>offered(s,k));if(!subs.length)continue;if(placesBy(k)>=n)continue;const c=Math.ceil(n*1.05/subs.length);subs.forEach(s=>{if((+s.cap||0)<c)s.cap=c;});}},
  enableOutside(){S.settings.allowOutside=true;},
  perStudentMax(){S.settings.periods=Math.max(1,Math.min(3,activeSubs().length));}
};

function placesBy(k){return activeSubs().filter(s=>offered(s,k)).reduce((a,s)=>a+(+s.cap||0),0);}
function dynamicIssues(){

  if(!subs.length){add('nosub',{level:'error',title:'No hi ha cap matèria activa',detail:'Activa almenys una matèria al pas Matèries.'});return out;}
  if(Nreq>subs.length)add('nmax',{level:'error',title:`Cal assignar ${Nreq} optatives diferents però només hi ha ${subs.length} matèries actives`,detail:'Un alumne no pot repetir optativa entre trimestres.',fixes:[{label:`Reduir a ${subs.length} ${subs.length===1?'assignació':'assignacions'}`,kind:'perStudentMax',args:[]}]});
  const N=periods();const n=S.students.length;
  for(let k=0;k<N;k++){
    const off=subs.filter(s=>offered(s,k));
    if(!off.length){add('nooff'+k,{level:'error',title:`Cap matèria s’ofereix al ${TL[k]}`,detail:'Marca almenys una matèria per a aquest trimestre al pas Matèries.'});continue;}

  }
  const act=new Set(subs.map(s=>s.id));
  const few=S.students.filter(s=>s.choices.filter(id=>act.has(id)).length<N);
  if(few.length)add('few',{level:S.settings.allowOutside?'info':'warn',cat:'Alumnes',title:`${pl(few.length,'alumne té','alumnes tenen')} menys tries actives que ${N===1?'matèries a cursar':'trimestres'}`,detail:S.settings.allowOutside?'Se’ls completarà amb matèries no triades amb places lliures.':'Quedaran amb places sense assignar. Pots permetre matèries no triades al pas Criteris.',rows:few.map(s=>s.row),fixes:S.settings.allowOutside?[]:[{label:'Permetre matèries no triades',kind:'enableOutside',args:[]}]});

    if(t2.length)add('t2',{level:'warn',cat:'Alumnes',title:`${pl(t2.length,'alumne no pot','alumnes no poden')} rebre la 1a ni la 2a tria`,detail:'Aquestes matèries no s’ofereixen en cap trimestre.',rows:t2.map(s=>s.row)});
  }
  const ment={};S.students.forEach(s=>s.choices.forEach(id=>ment[id]=(ment[id]||0)+1));
  subs.forEach(s=>{if(!ment[s.id])add('zero'+s.id,{level:'info',title:`Ningú ha triat «${s.name}»`,detail:'Potser cal desactivar-la.'});
    if(+s.min&&(+s.min>(+s.cap||0)))add('minmax'+s.id,{level:'warn',title:`«${s.name}»: el mínim (${s.min}) és més gran que la capacitat (${s.cap})`});});
  const joinPairs=new Map();
  S.constraints.filter(g=>g.type==='join').forEach(g=>{for(let a=0;a<g.members.length;a++)for(let b=a+1;b<g.members.length;b++){const k=[g.members[a],g.members[b]].sort().join('|');joinPairs.set(k,g);}});
  S.constraints.filter(g=>g.type==='sep').forEach(g=>{for(let a=0;a<g.members.length;a++)for(let b=a+1;b<g.members.length;b++){const k=[g.members[a],g.members[b]].sort().join('|');if(joinPairs.has(k)){const A=byId(g.members[a]),B=byId(g.members[b]);if(A&&B)add('contra'+k,{level:'error',cat:'Restriccions',title:`Contradicció: ${A.name} i ${B.name}`,detail:'Hi ha una restricció per ajuntar-los i una altra per separar-los. Elimina’n una al pas Ajuntar i separar.'});}}});
  S.constraints.forEach(g=>{
    const mem=g.members.map(byId).filter(Boolean);if(mem.length<2)return;
    if(g.type==='join'){
      let common=null;mem.forEach(s=>{const c=new Set(s.choices.filter(id=>act.has(id)));common=common?new Set([...common].filter(x=>c.has(x))):c;});
      if(common.size<N)add('nocommon'+g.id,{level:'warn',cat:'Restriccions',title:`${common.size?`Només ${common.size} ${common.size===1?'matèria comuna':'matèries comunes'}`:'Cap matèria comuna'} al grup: ${mem.map(s=>s.name).join(', ')}`,detail:(N>1?`Per coincidir els ${N} trimestres en calen ${N}. `:'')+(g.strength==='hard'?'És obligatori: algú haurà d’anar a una matèria que no ha triat.':'És preferent: probablement no es podrà complir del tot.')});

    }else if(mem.length>subs.length)add('bigsep'+g.id,{level:'warn',cat:'Restriccions',title:`No es poden separar ${mem.length} alumnes en ${subs.length} matèries`,detail:mem.map(s=>s.name).join(', ')});
  });

}
function allIssues(){DYN=dynamicIssues();return[...DYN,...S.issues.filter(i=>!i.resolved)];}

/* ============================================================
   Model d'optimització
   Unitat = matèria × trimestre. Cada alumne té un forat per trimestre
   i mai no pot repetir matèria entre forats.
   ============================================================ */
function buildModel(){
  const set=S.settings;const subs=activeSubs();const nJ=subs.length;const jOf=new Map(subs.map((s,j)=>[s.id,j]));
  const studs=S.students,nS=studs.length,N=periods();
  const unitOf=new Int32Array(nJ*N).fill(-1);const uSub=[],uT=[];
  subs.forEach((s,j)=>{for(let k=0;k<N;k++)if(offered(s,k)){unitOf[j*N+k]=uSub.length;uSub.push(j);uT.push(k);}});
  const nU=uSub.length;
  const prefs=studs.map(st=>st.choices.map(id=>jOf.get(id)).filter(j=>j!==undefined));
  const rkS=studs.map((st,i)=>{const r=new Int16Array(nJ).fill(99);prefs[i].forEach((j,p)=>r[j]=p);return r;});
  const outC=set.allowOutside?(+set.outsideCost||0):BIG;
  const C=studs.map((st,i)=>{const row=new Float64Array(nJ).fill(outC);prefs[i].forEach((j,r)=>row[j]=costAt(r));return row;});
  const cap=Int32Array.from(uSub.map(j=>Math.max(0,Math.floor(+subs[j].cap||0))));
  const min=Int32Array.from(uSub.map(j=>Math.max(0,Math.floor(+subs[j].min||0))));
  const crit=[];
  S.criteria.forEach(c=>{const lv=+(set.balance[c.key]||0);if(!lv)return;const cats=[],cnt=[];const val=new Int32Array(nS).fill(-1);
    studs.forEach((st,i)=>{const v=norm(st.attrs[c.key]);if(!v)return;let k=cats.indexOf(v);if(k<0){cats.push(v);cnt.push(0);k=cats.length-1;}val[i]=k;cnt[k]++;});
    const tot=cnt.reduce((a,b)=>a+b,0);if(cats.length<2||!tot)return;
    crit.push({key:c.key,val,K:cats.length,p:Float64Array.from(cnt.map(x=>x/tot)),w:BAL_W[lv]});});
  const sIdx=new Map(studs.map((s,i)=>[s.id,i]));
  const groups=[],mg=studs.map(()=>[]);
  S.constraints.forEach(g=>{const mem=[...new Set(g.members.map(id=>sIdx.get(id)).filter(x=>x!==undefined))];if(mem.length<2)return;const gi=groups.length;groups.push({type:g.type,w:g.strength==='hard'?(+set.hardW||2000):softWeight(),mem});mem.forEach(i=>mg[i].push(gi));});
  const asg0=studs.map(st=>{const src=slotsOf(st.id);const a=[];const seen=new Set();for(let k=0;k<N;k++){const j=jOf.get(src[k]);if(j===undefined||seen.has(j)){a.push(-1);continue;}seen.add(j);a.push(unitOf[j*N+k]);}return a;});
  const locked=Uint8Array.from(studs.map((st,i)=>S.locked[st.id]&&asg0[i].every(u=>u>=0)?1:0));
  return{subs,nJ,jOf,studs,nS,N,nU,unitOf,uSub,uT,prefs,rkS,C,cap,min,crit,groups,mg,asg0,locked,sIdx,fillMin:!!set.fillMin,fillW:+set.fillW||0,scale:Math.max(5,(costAt(1)-costAt(0))||10),top2W:(N>1&&set.top2)?(+set.top2W||0):0};
}
function mkState(M,init){
  const{nS,nU,N}=M;const st={A:new Int32Array(nS*N).fill(-1),cnt:new Int32Array(nU),cc:M.crit.map(c=>({a:new Int32Array(nU*c.K),n:new Int32Array(nU)}))};
  for(let i=0;i<nS;i++)for(let k=0;k<N;k++){const u=init[i][k];if(u>=0){st.A[i*N+k]=u;addTo(M,st,i,u,1);}}
  return st;
}
function addTo(M,st,i,j,d){st.cnt[j]+=d;for(let c=0;c<M.crit.length;c++){const v=M.crit[c].val[i];if(v>=0){st.cc[c].a[j*M.crit[c].K+v]+=d;st.cc[c].n[j]+=d;}}}
function subjPen(M,st,j){
  if(j<0)return 0;let p=0;
  for(let c=0;c<M.crit.length;c++){const C=M.crit[c],n=st.cc[c].n[j];if(!n)continue;const a=st.cc[c].a,b=j*C.K;let s=0;for(let v=0;v<C.K;v++){const d=a[b+v]-n*C.p[v];s+=d*d;}p+=C.w*s;}
  if(M.fillMin){const x=st.cnt[j];if(x>0&&x<M.min[j])p+=(M.min[j]-x)*M.fillW;}
  return p;
}
function hasJ(M,st,i,j){const N=M.N,o=i*N;for(let k=0;k<N;k++)if(st.A[o+k]===j)return true;return false;}
function top2ok(M,st,i){const N=M.N,o=i*N,r=M.rkS[i];for(let k=0;k<N;k++){const u=st.A[o+k];if(u>=0&&r[M.uSub[u]]<2)return true;}return false;}
const ucost=(M,i,u)=>u>=0?M.C[i][M.uSub[u]]:UNC;
function setSlot(M,st,i,k,t){
  const N=M.N,o=i*N+k,s=st.A[o];if(s===t)return 0;
  let d=ucost(M,i,t)-ucost(M,i,s);
  const gl=M.mg[i];
  for(let q=0;q<gl.length;q++){const G=M.groups[gl[q]];let ds=0;const mem=G.mem;for(let u=0;u<mem.length;u++){const m=mem[u];if(m===i)continue;if(t>=0&&hasJ(M,st,m,t))ds++;if(s>=0&&hasJ(M,st,m,s))ds--;}d+=G.type==='join'?-ds*G.w:ds*G.w;}
  const tb=M.top2W?top2ok(M,st,i):true;
  const before=subjPen(M,st,s)+subjPen(M,st,t);
  st.A[o]=t;if(s>=0)addTo(M,st,i,s,-1);if(t>=0)addTo(M,st,i,t,1);
  d+=subjPen(M,st,s)+subjPen(M,st,t)-before;
  if(M.top2W){const ta=top2ok(M,st,i);if(ta!==tb)d+=ta?-M.top2W:M.top2W;}
  return d;
}
function totalCost(M,st){
  const N=M.N;let T=0;
  for(let i=0;i<M.nS;i++){for(let k=0;k<N;k++)T+=ucost(M,i,st.A[i*N+k]);if(M.top2W&&!top2ok(M,st,i))T+=M.top2W;}
  for(let j=0;j<M.nU;j++)T+=subjPen(M,st,j);
  M.groups.forEach(G=>{const m=G.mem;for(let a=0;a<m.length;a++)for(let b=a+1;b<m.length;b++){let sh=0;for(let k=0;k<N;k++){const j=st.A[m[a]*N+k];if(j>=0&&hasJ(M,st,m[b],j))sh++;}T+=G.type==='join'?(N-sh)*G.w:sh*G.w;}});
  return T;
}
function canTake(M,st,i,k,t){
  if(t<0)return true;if(M.uT[t]!==k)return false;const j=M.uSub[t];if(M.C[i][j]>=BIG)return false;
  const N=M.N,o=i*N;
  for(let kk=0;kk<N;kk++){if(kk===k)continue;const x=st.A[o+kk];if(x>=0&&M.uSub[x]===j)return false;}
  return true;
}
/* flux de cost mínim (bipartit, cada alumne demanda 1) */
function flowAssign(nL,nR,adj,capR){
  let V=0;const SRC=V++,SNK=V++;const R0=V;V+=nR;const L0=V;V+=nL;
  const eto=[],ecap=[],ecost=[],enext=[];const head=new Int32Array(V).fill(-1);
  const addE=(u,v,c,w)=>{const e=eto.length;eto.push(v,u);ecap.push(c,0);ecost.push(w,-w);enext.push(head[u],head[v]);head[u]=e;head[v]=e+1;return e;};
  for(let r=0;r<nR;r++)addE(R0+r,SNK,Math.max(0,capR[r]),0);
  const se=[];
  for(let i=0;i<nL;i++){addE(SRC,L0+i,1,0);adj[i].forEach(([r,w])=>{se.push(addE(L0+i,R0+r,1,w),i,r);});}
  const dist=new Float64Array(V),inq=new Uint8Array(V),pe=new Int32Array(V),q=new Int32Array(V+1);
  for(let guard=0;guard<nL+2;guard++){
    dist.fill(Infinity);pe.fill(-1);dist[SRC]=0;let qh=0,qt=0;q[qt++]=SRC;inq[SRC]=1;
    while(qh!==qt){const u=q[qh];qh=(qh+1)%(V+1);inq[u]=0;for(let e=head[u];e!==-1;e=enext[e]){if(ecap[e]<=0)continue;const v=eto[e],nd=dist[u]+ecost[e];if(nd<dist[v]-1e-9){dist[v]=nd;pe[v]=e;if(!inq[v]){inq[v]=1;q[qt]=v;qt=(qt+1)%(V+1);}}}}
    if(dist[SNK]===Infinity)break;
    for(let v=SNK;v!==SRC;v=eto[pe[v]^1]){ecap[pe[v]]-=1;ecap[pe[v]^1]+=1;}
  }
  const res=new Int32Array(nL).fill(-1);for(let x=0;x<se.length;x+=3)if(ecap[se[x]]===0)res[se[x+1]]=se[x+2];return res;
}
/* solució inicial: un flux òptim per trimestre, sense repetir matèries */
function flowInit(M){
  const{nS,N}=M;const init=M.asg0.map(a=>a.slice());
  for(let i=0;i<nS;i++)if(!M.locked[i])init[i]=new Array(N).fill(-1);
  for(let k=0;k<N;k++){
    const units=[],ui=new Map();for(let u=0;u<M.nU;u++)if(M.uT[u]===k){ui.set(u,units.length);units.push(u);}
    const capR=units.map(u=>M.cap[u]);
    for(let i=0;i<nS;i++)if(M.locked[i]){const u=init[i][k];if(u>=0&&ui.has(u))capR[ui.get(u)]--;}
    const L=[],adj=[];
    for(let i=0;i<nS;i++){if(M.locked[i])continue;const used=new Set(init[i].filter(u=>u>=0).map(u=>M.uSub[u]));const a=[];units.forEach((u,r)=>{const j=M.uSub[u];if(used.has(j)||M.C[i][j]>=BIG)return;a.push([r,M.C[i][j]]);});L.push(i);adj.push(a);}
    const res=flowAssign(L.length,units.length,adj,capR);
    res.forEach((r,x)=>{if(r>=0)init[L[x]][k]=units[r];});
  }
  return init;
}
/* recuit simulat sobre l'objectiu complet */
async function anneal(M,st,opt){
  const{N,nJ}=M;const mov=[];for(let i=0;i<M.nS;i++)if(!M.locked[i])mov.push(i);
  if(!mov.length||!M.nU)return st;
  const joinG=M.groups.filter(g=>g.type==='join');
  let cur=totalCost(M,st),best=cur;const bestA=st.A.slice();
  const iters=opt.iters,T0=opt.T0,lr=Math.log(opt.T1/T0);
  const undo=[];const R=Math.random,ri=n=>(R()*n)|0;
  const doSet=(i,k,t)=>{undo.push(i,k,st.A[i*N+k]);return setSlot(M,st,i,k,t);};
  const rollback=()=>{for(let u=undo.length-3;u>=0;u-=3)setSlot(M,st,undo[u],undo[u+1],undo[u+2]);};
  const holder=(t,ex)=>{const k=M.uT[t];for(let tr=0;tr<40;tr++){const j=mov[ri(mov.length)];if(j!==ex&&st.A[j*N+k]===t)return j;}return -1;};
  for(let it=0;it<iters;it++){
    if((it&8191)===0){opt.progress&&opt.progress(it/iters);await sleep(0);}
    const T=T0*Math.exp(lr*it/iters);undo.length=0;let d=0,ok=true;const r=R();
    const type=r<.5?0:r<.8?1:r<.9?(N>1?2:1):(joinG.length?3:1);
    if(type===0){
      const i=mov[ri(mov.length)],k=ri(N),s=st.A[i*N+k],P=M.prefs[i];
      const j=(P.length&&R()<.85)?P[Math.floor(R()*R()*P.length)]:ri(nJ);
      const t=M.unitOf[j*N+k];
      if(t<0||t===s||!canTake(M,st,i,k,t))continue;
      if(st.cnt[t]<M.cap[t])d=doSet(i,k,t);
      else{const j2=holder(t,i);if(j2<0||!canTake(M,st,j2,k,s))continue;d=doSet(i,k,t);d+=doSet(j2,k,s);}
    }else if(type===1){
      const i=mov[ri(mov.length)],j=mov[ri(mov.length)];if(j===i)continue;const k=ri(N),s=st.A[i*N+k],t=st.A[j*N+k];if(t===s)continue;
      if(!canTake(M,st,i,k,t)||!canTake(M,st,j,k,s))continue;
      d=doSet(i,k,t);d+=doSet(j,k,s);
    }else if(type===2){
      const i=mov[ri(mov.length)],k1=ri(N),k2=(k1+1+ri(N-1))%N,a=st.A[i*N+k1],b=st.A[i*N+k2];if(a<0||b<0)continue;
      const a2=M.unitOf[M.uSub[b]*N+k1],b2=M.unitOf[M.uSub[a]*N+k2];if(a2<0||b2<0)continue;
      if(st.cnt[a2]>=M.cap[a2]||st.cnt[b2]>=M.cap[b2])continue;
      d=doSet(i,k1,a2);d+=doSet(i,k2,b2);
    }else{
      const G=joinG[ri(joinG.length)];const src=G.mem[ri(G.mem.length)];const P=M.prefs[src];if(!P.length)continue;const k=ri(N);const t=M.unitOf[P[ri(Math.min(P.length,4))]*N+k];if(t<0)continue;const before=st.cnt[t];
      for(const m of G.mem){if(M.locked[m]||st.A[m*N+k]===t||!canTake(M,st,m,k,t))continue;d+=doSet(m,k,t);}
      if(!undo.length)continue;
      if(st.cnt[t]>Math.max(M.cap[t],before))ok=false;
    }
    if(ok&&(d<=0||R()<Math.exp(-d/T))){cur+=d;if(cur<best-1e-9){best=cur;bestA.set(st.A);}}
    else rollback();
  }
  const init=[];for(let i=0;i<M.nS;i++)init.push(Array.from(bestA.subarray(i*N,i*N+N)));
  return mkState(M,init);
}
function writeBack(M,st){
  let changed=0;const N=M.N;
  M.studs.forEach((s,i)=>{const a=[];for(let k=0;k<N;k++){const u=st.A[i*N+k];a.push(u>=0?M.subs[M.uSub[u]].id:null);}if(JSON.stringify(slotsOf(s.id))!==JSON.stringify(a))changed++;S.asg[s.id]=a;});
  return changed;
}
let RUNNING=false;
async function runOptimize(mode){
  if(RUNNING)return;
  DYN=dynamicIssues();
  const block=DYN.find(i=>i.level==='error'&&(i.id==='d:nosub'||i.id==='d:nmax'||String(i.id).startsWith('d:nooff')));
  if(block){toast(block.title,'bad');return;}
  if(!S.students.length){toast('Primer carrega les dades de l’alumnat.','bad');return;}
  RUNNING=true;showBusy(mode==='full'?'Calculant l’assignació':'Millorant l’assignació actual');
  await sleep(30);
  try{
    pushHist();
    const M=buildModel();
    let st=mode==='full'?mkState(M,flowInit(M)):mkState(M,M.asg0);
    const base=Math.max(40000,Math.min(500000,M.nS*M.N*600));
    const iters=Math.round(base*INTENS.exhaustiva.f);
    const T0=mode==='full'?Math.max(4,M.scale*.5):Math.max(1,M.scale*.08);
    st=await anneal(M,st,{iters,T0,T1:.05,progress:p=>setBusy(p)});
    const changed=writeBack(M,st);
    S.lastRun={at:Date.now(),mode,changed};
    STATS=null;const s=computeStats();const h=headline(s);
    persist();hideBusy();render();refreshDrawer();
    const k=`${fmtPct(h.v,s.nStud)} ${h.l}`;
    toast(mode==='full'?`Assignació feta: ${k}.`:`Millora feta: ${pl(changed,'alumne ha canviat','alumnes han canviat')}. ${k}.`);
  }catch(e){hideBusy();toast('S’ha produït un error en calcular: '+e.message,'bad');console.error(e);}
  RUNNING=false;
}
function suggestFor(sid){
  const M=buildModel();const st=mkState(M,M.asg0);const i=M.sIdx.get(sid);if(i===undefined)return[];M.locked[i]=0;const N=M.N;const out=[];
  for(let k=0;k<N;k++){const s=st.A[i*N+k];
    for(let j=0;j<M.nJ;j++){const t=M.unitOf[j*N+k];if(t<0||t===s||!canTake(M,st,i,k,t))continue;
      if(st.cnt[t]<M.cap[t]){const d=setSlot(M,st,i,k,t);setSlot(M,st,i,k,s);out.push({k,s,t,d});}
      else{let bs=null;for(let p=0;p<M.nS;p++){if(p===i||M.locked[p]||st.A[p*N+k]!==t||!canTake(M,st,p,k,s))continue;let d=setSlot(M,st,i,k,t);d+=setSlot(M,st,p,k,s);setSlot(M,st,p,k,t);setSlot(M,st,i,k,s);if(!bs||d<bs.d)bs={k,s,t,d,p};}if(bs)out.push(bs);}
    }}
  out.sort((a,b)=>a.d-b.d);
  const sid2=u=>u>=0?M.subs[M.uSub[u]].id:null;
  return out.slice(0,6).map(o=>({k:o.k,from:sid2(o.s),to:sid2(o.t),d:o.d,partner:o.p!==undefined?M.studs[o.p].id:null}));
}

function computeStats(){
  if(STATS)return STATS;
  const subs=activeSubs();const act=new Set(subs.map(s=>s.id));const N=periods();
  const per={},sub={},dem={};
  subs.forEach(s=>sub[s.id]={tot:0,dem1:0,byT:Array.from({length:N},()=>({n:0,first:0,members:[]}))});
  S.subjects.forEach(s=>dem[s.id]={d1:0,top3:0,men:0});
  const hist=new Array(8).fill(0),histT=Array.from({length:N},()=>new Array(8).fill(0)),outT=new Array(N).fill(0),unT=new Array(N).fill(0);
  let out=0,unSlots=0,unStud=0,has1=0,has12=0,allTop=0,allTop3=0,sumR=0,nR=0,assigned=false;
  S.students.forEach(st=>{
    st.choices.forEach((id,r)=>{const d=dem[id];if(!d)return;d.men++;if(r<3)d.top3++;if(r===0)d.d1++;});
    const prefs=st.choices.filter(id=>act.has(id));
    const a=slotsOf(st.id);
    const ranks=a.map(x=>x?prefs.indexOf(x):null);
    let miss=0;
    a.forEach((x,k)=>{if(!x){miss++;unSlots++;unT[k]++;return;}assigned=true;const r=ranks[k];
      if(r<0){out++;outT[k]++;}else{const b=Math.min(r,7);hist[b]++;histT[k][b]++;sumR+=r+1;nR++;}
      const X=sub[x];X.tot++;const Y=X.byT[k];Y.n++;Y.members.push(st.id);if(r===0)Y.first++;});
    if(miss)unStud++;
    if(prefs[0]&&sub[prefs[0]])sub[prefs[0]].dem1++;
    const h1=ranks.some(r=>r===0),h12=ranks.some(r=>r!==null&&r>=0&&r<2);
    if(h1)has1++;if(h12)has12++;
    if(!miss&&ranks.every(r=>r>=0&&r<N))allTop++;
    if(!miss&&ranks.every(r=>r>=0&&r<N+2))allTop3++;
    per[st.id]={a,ranks,prefs,miss,h1,h12};
  });
  const viol=new Set();
  const cons=S.constraints.map(g=>{const s=assigned?consStatus(g,N):null;if(s)s.bad.forEach(([x,y])=>{viol.add(x);viol.add(y);});return{g,st:s};});
  STATS={subs,N,per,sub,dem,hist,histT,out,outT,unSlots,unT,unStud,has1,has12,allTop,allTop3,meanR:nR?sumR/nR:0,assigned,cons,viol,nStud:S.students.length,consOk:cons.filter(c=>c.st&&c.st.ok).length};
  return STATS;
}
function headline(st){return st.N===1?{v:st.has1,l:'amb la 1a opció',s:'1a opció'}:{v:st.has12,l:'amb la 1a o 2a tria en algun trimestre',s:'1a o 2a tria'};}
function consStatus(g,N){
  const mem=g.members.filter(id=>SIDX.has(id));const bad=[];let partial=false;
  const sl=new Map(mem.map(id=>[id,slotsOf(id)]));
  for(let a=0;a<mem.length;a++)for(let b=a+1;b<mem.length;b++){const A=sl.get(mem[a]),B=sl.get(mem[b]);let sh=0;for(let k=0;k<N;k++)if(A[k]&&A[k]===B[k])sh++;
    if(g.type==='join'){if(sh===0)bad.push([mem[a],mem[b]]);else if(sh<N)partial=true;}else if(sh>0)bad.push([mem[a],mem[b]]);}
  return{ok:!bad.length,bad,partial};
}
function rankOf(sid,subId){const p=STATS.per[sid];if(!p)return null;return p.prefs.indexOf(subId);}
function rk(r){
  if(r===null||r===undefined)return'<span class="rk rk-none" title="Sense assignar">–</span>';
  if(r<0)return'<span class="rk rk-out" title="Matèria no triada">F</span>';
  return`<span class="rk rk${Math.min(r,7)+1}" title="Opció ${r+1}">${r+1}</span>`;
}
const rankTxt=r=>r===null||r===undefined?'Sense assignar':r<0?'No triada':`${r+1}a opció`;
function desajust(members,key){const cats=critCats(key);const tot=cats.reduce((a,b)=>a+b[1],0);if(!tot)return 0;const m=new Map();let t=0;members.forEach(id=>{const v=byId(id)?.attrs[key];if(!v)return;m.set(v,(m.get(v)||0)+1);t++;});let s=0;cats.forEach(([v,c])=>{s+=Math.abs((m.get(v)||0)-t*c/tot);});return s/2;}
let CATC={};
function critCats(key){if(CATC[key])return CATC[key];const m=new Map();S.students.forEach(s=>{const v=s.attrs[key];if(v)m.set(v,(m.get(v)||0)+1);});return CATC[key]=[...m.entries()].sort((a,b)=>b[1]-a[1]);}
function catColor(i){return i<8?`var(--c${i+1})`:'var(--faint)';}
function critPalette(key){const cats=critCats(key);const top=cats.slice(0,7).map(c=>c[0]);return{cats,col:v=>{const i=top.indexOf(v);return i>=0?catColor(i):'var(--faint)';},label:v=>top.includes(v)?v:'Altres',top,hasOther:cats.length>7};}
let TIPS=[];
function sbar(members,key,pal,title,big){
  const m=new Map();let tot=0;members.forEach(id=>{const v=byId(id)?.attrs[key];if(!v)return;const l=pal.label(v);m.set(l,(m.get(l)||0)+1);tot++;});
  const g=new Map();let gt=0;critCats(key).forEach(([v,c])=>{const l=pal.label(v);g.set(l,(g.get(l)||0)+c);gt+=c;});
  const order=[...pal.top,...(pal.hasOther?['Altres']:[])];
  const col=l=>l==='Altres'?'var(--faint)':pal.col(l);
  const crit=S.criteria.find(c=>c.key===key);
  const id=TIPS.length;
  TIPS.push({title:title||'',crit:crit?crit.label:'',n:members.length,tot,empty:members.length-tot,dev:tot?desajust(members,key):0,rows:order.map(l=>({l,col:col(l),n:m.get(l)||0,p:tot?(m.get(l)||0)*100/tot:0,gp:gt?(g.get(l)||0)*100/gt:0}))});
  const lbl=`${crit?crit.label+': ':''}`+order.filter(l=>m.has(l)).map(l=>`${l} ${Math.round(m.get(l)*100/tot)}%`).join(', ');

  return`<div class="sbar ${big?'lg':''}" data-tip="${id}" tabindex="0" aria-label="${esc(lbl)}">${order.filter(l=>m.has(l)).map(l=>`<i data-seg="${esc(l)}" style="width:${m.get(l)*100/tot}%;background:${col(l)}"></i>`).join('')}</div>`;
}
const pct1=v=>(Math.round(v*10)/10).toLocaleString('ca-ES')+'%';

function stepInfo(id){
  const n=S.students.length;
  if(id==='dades')return{sub:n?`${n} alumnes`:'Carrega l’Excel',done:n>0};
  if(!n)return{sub:'',done:false};
  if(id==='revisio'){const is=allIssues().filter(i=>!i.dismissed);const e=is.filter(i=>i.level==='error').length,w=is.filter(i=>i.level==='warn').length;return{sub:e?`${pl(e,'error','errors')}`:w?`${pl(w,'avís','avisos')}`:'Tot correcte',flag:e?['bad',e]:w?['warn',w]:null,done:!e&&!w};}
  if(id==='materies'){const a=activeSubs();const N=periods();const pk=Array.from({length:N},(_,k)=>placesBy(k));const mn=Math.min(...pk);return{sub:`${a.length} actives · ${N===1?mn+' places':N+' trimestres'}`,flag:mn<n?['bad','!']:null,done:mn>=n&&a.length>0};}
  if(id==='restriccions'){const st=computeStats();const bad=st.cons.filter(c=>c.st&&!c.st.ok).length;return{sub:S.constraints.length?`${pl(S.constraints.length,'grup','grups')}`:'Cap grup',flag:bad?['warn',bad]:null,done:S.constraints.length>0&&!bad};}
  if(id==='criteris'){const b=S.criteria.filter(c=>+S.settings.balance[c.key]>0).length;const st=STRATS[S.settings.strategy];return{sub:(st?st.label.split(' ')[0]+(S.settings.strategy==='primeres'?' opcions':''):'Personalitzat')+(b?` · ${b} equilibri`:''),done:false};}
  if(id==='assignacio'){const st=computeStats();if(!st.assigned)return{sub:'Pendent',done:false};const h=headline(st);return{sub:`${fmtPct(h.v,st.nStud)} ${h.s}`,flag:st.unStud?['bad',st.unStud]:null,done:true};}
  if(id==='resultats'){const st=computeStats();return{sub:st.assigned?'Informe i exportació':'',done:false};}
  return{sub:''};
}

  const mapRows=[];
  for(let i=0;i<w;i++){

    <select class="in" id="role-${i}" data-ch="role" data-i="${i}" aria-label="Ús de la columna ${colL(i)}">${ROLES.map(([k,l])=>`<option value="${k}" ${k===role?'selected':''}>${l}</option>`).join('')}</select></div>`);
  }
  const previewCols=[];for(let i=0;i<w;i++)if(R[i]!=='ignorar')previewCols.push(i);
  return`
  <div class="head"><div><h1>Dades de l’alumnat</h1><p class="lead">Comprova com s’interpreta cada columna. Pots canviar-ne l’ús amb el desplegable. Les tries s’ordenen pel número del títol (Tria 1, Tria 2…) o, si no en tenen, per l’ordre de les columnes.</p></div>
  <div class="row"><button class="btn" data-act="pickMain">${ic('file')}Canviar de fitxer</button></div></div>
  <div class="card"><div class="card-h"><div><h2>${esc(S.file.name)}</h2><p>${S.file.order.length>1?`${S.file.order.length} fulls · `:''}${data.length} files amb dades</p></div>
    <div class="row">
      ${S.file.order.length>1?`<div class="field"><label for="sheetSel">Full</label><select class="in" id="sheetSel" data-ch="sheet">${S.file.order.map(n=>`<option ${n===S.map.sheet?'selected':''}>${esc(n)}</option>`).join('')}</select></div>`:''}
      <div class="field"><label for="hdrRow">Fila de capçalera</label><input class="in n" type="number" min="1" id="hdrRow" value="${hr+1}" data-ch="hdrRow"></div>
    </div></div>
    ${consSheets.length?`<div class="card-b"><div class="note">${ic('info')}<span>Aquest fitxer té ${consSheets.length===1?'un full':'fulls'} que sembla${consSheets.length===1?'':'n'} de restriccions (${consSheets.map(n=>'«'+esc(n)+'»').join(', ')}). Els podràs importar al pas Ajuntar i separar.</span></div></div>`:''}
    <div class="map-row head-r"><span>Col.</span><span>Títol</span><span>Exemples</span><span>Ús</span></div>
    ${mapRows.join('')}
  </div>
  ${warns.length?`<div class="note bad">${ic('alert')}<span>${warns.join(' ')}</span></div>`:''}
  <div class="card"><div class="card-h"><div><h2>Vista prèvia</h2><p>Primeres files amb les columnes que s’utilitzaran</p></div></div>
  <div class="tbl-wrap"><table class="tbl ex-tbl"><thead><tr>${previewCols.map(i=>`<th><span class="role-tag">${R[i]==='tria'?'Tria '+(tC.indexOf(i)+1):esc(ROLE_L[R[i]])}</span>${esc(hdr[i]||colL(i))}</th>`).join('')}</tr></thead>
  <tbody>${data.slice(0,6).map(r=>`<tr>${previewCols.map(i=>`<td>${esc(r[i]||'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>
  <div class="row end">${S.applied?'<span class="hint">Tornar a aplicar reinicia l’assignació. Es conserven la configuració de les matèries i els grups creats a mà.</span>':''}<button class="btn primary" data-act="applyMap" ${warns.length?'disabled':''}>Aplicar i revisar les dades ${ic('chev')}</button></div>`;
};

  <div class="tbl-wrap"><table class="tbl ex-tbl"><thead><tr><th>Nom</th><th>Cognoms</th><th>Grup</th><th>Escoleta</th><th>Gènere</th><th>Nivell</th><th>Tria 1</th><th>Tria 2</th><th>Tria 3</th><th>…</th><th>Ajuntar</th><th>Separar</th></tr></thead>

  <tr><td>Marc</td><td>Ferrer Mas</td><td>Grup B</td><td>Escola La Serra</td><td>Noi</td><td>Mitjà</td><td>Teatre</td><td>Música</td><td>Robòtica</td><td>…</td><td>G1</td><td>Pol Riera Font</td></tr></tbody></table></div>

/* ---------------- Vista: Revisió ---------------- */
VIEWS.revisio=function(){
  if(!S.students.length)return needData();
  const all=allIssues();
  const vis=all.filter(i=>(UI.showDismissed||!i.dismissed)&&(UI.issueF==='all'||i.level===UI.issueF));
  const cnt=l=>all.filter(i=>!i.dismissed&&i.level===l).length;
  const dis=all.filter(i=>i.dismissed).length;
  const nC=S.students.reduce((a,s)=>a+s.choices.length,0);
  const dists=S.criteria.map(c=>{const cats=critCats(c.key);const emp=S.students.filter(s=>!s.attrs[c.key]).length;return`<div><div class="k">${esc(c.label)}</div><div class="dist">${cats.slice(0,8).map(([v,n])=>`<span>${esc(v)}<b>${n}</b></span>`).join('')}${cats.length>8?`<span>+${cats.length-8} més</span>`:''}${emp?`<span class="faint">(buit)<b>${emp}</b></span>`:''}</div></div>`;}).join('');
  const LV={error:['bad','Error'],warn:['warn','Avís'],info:['acc','Informació']};
  return`
  <div class="head"><div><h1>Revisió de les dades</h1><p class="lead">Possibles problemes detectats al fitxer i a la configuració. Els errors impedeixen una bona assignació; els avisos convé revisar-los. Molts es poden corregir aquí mateix.</p></div>
  <div class="row"><a class="btn primary" href="#materies">Continuar a Matèries ${ic('chev')}</a></div></div>
  <div class="card"><div class="sumgrid">
    <div><div class="v">${S.students.length}</div><div class="k">alumnes</div></div>
    <div><div class="v">${S.subjects.length}</div><div class="k">matèries detectades</div></div>
    <div><div class="v">${fmt1(nC/S.students.length)}</div><div class="k">tries per alumne (mitjana)</div></div>
    <div><div class="v">${S.constraints.length}</div><div class="k">grups d’ajuntar o separar</div></div>
  </div>${dists?`<div class="card-b stack">${dists}</div>`:''}</div>
  <div class="toolbar">
    <div class="seg" role="group" aria-label="Filtre">
      ${[['all','Tots',all.filter(i=>!i.dismissed).length],['error','Errors',cnt('error')],['warn','Avisos',cnt('warn')],['info','Informació',cnt('info')]].map(([k,l,n])=>`<button class="${UI.issueF===k?'on':''}" data-act="issueF" data-v="${k}">${l} <span class="num">${n}</span></button>`).join('')}
    </div><span class="sp"></span>
    ${dis?`<label class="switch small"><input type="checkbox" data-ch="showDis" ${UI.showDismissed?'checked':''}> Mostrar ignorats (${dis})</label>`:''}
  </div>
  <div class="stack">${vis.length?vis.map(i=>{const[c,l]=LV[i.level];return`<div class="issue lv-${i.level} ${i.dismissed?'dismissed':''}"><span class="stripe"></span><div class="im"><div class="it"><span class="pill ${c}">${l}</span><span>${esc(i.title)}</span><span class="cat">${esc(i.cat||'')}</span></div>${i.detail?`<div class="id">${esc(i.detail)}</div>`:''}${i.rows&&i.rows.length?`<div class="id small">${i.rows.length===1?'Fila':'Files'} de l’Excel: <span class="mono">${i.rows.slice(0,30).join(', ')}${i.rows.length>30?'…':''}</span></div>`:''}</div>
    <div class="ia">${(i.fixes||[]).map((f,k)=>`<button class="btn sm" data-act="fix" data-id="${i.id}" data-k="${k}">${esc(f.label)}</button>`).join('')}${i.level!=='error'?`<button class="btn sm ghost" data-act="dismiss" data-id="${i.id}">${i.dismissed?'Recuperar':'Ignorar'}</button>`:''}</div></div>`;}).join(''):`<div class="card"><div class="empty">${ic('check')}<h2>${UI.issueF==='all'?'No hi ha problemes pendents':'Res en aquesta categoria'}</h2><p>Pots continuar amb la configuració de les matèries.</p></div></div>`}</div>`;
};

/* ---------------- Vista: Matèries ---------------- */
LIVE.capSummary=function(){
  const a=activeSubs();const N=periods();const n=S.students.length;
  const pk=Array.from({length:N},(_,k)=>placesBy(k));const mn=Math.min(...pk);const ok=mn>=n;
  return`<div class="sumgrid"><div><div class="v">${a.length}<span class="faint" style="font-size:14px"> / ${S.subjects.length}</span></div><div class="k">matèries actives</div></div>
  <div><div class="v">${N===1?pk[0]:pk.join(' · ')}</div><div class="k">${N===1?'places disponibles':'places per trimestre ('+TS.slice(0,N).join(' · ')+')'}</div></div>
  <div><div class="v">${n}</div><div class="k">places necessàries${N>1?' per trimestre':''}</div></div>
  <div><div class="v" style="color:var(--${ok?'ok':'bad'})">${ok?'+'+(mn-n):mn-n}</div><div class="k">${ok?'places de marge':'places que falten'}${N>1?' al trimestre més just':''}</div></div></div>`;
};
function periodsSeg(){const N=Math.floor(+S.settings.periods)||1;return`<div class="seg" role="group" aria-label="Assignacions per alumne">${[1,2,3].map(v=>`<button class="${N===v?'on':''}" data-act="periods" data-v="${v}">${v===1?'Una assignació':v+' trimestres'}</button>`).join('')}</div>`;}
VIEWS.materies=function(){
  if(!S.students.length)return needData();
  const st=computeStats();const has=st.assigned;const N=periods();
  const rowsH=S.subjects.map(s=>{const d=st.dem[s.id]||{d1:0,top3:0,men:0};const x=st.sub[s.id];const nOff=Array.from({length:N},(_,k)=>offered(s,k)).filter(Boolean).length;
    let pr='';if(!s.active)pr='<span class="pill">Desactivada</span>';else if(!d.men)pr='<span class="pill">Sense demanda</span>';else if(N>1&&!nOff)pr='<span class="pill bad">Cap trimestre</span>';else if(d.d1>(+s.cap||0)*nOff)pr=`<span class="pill warn">${d.d1} primeres tries per ${(+s.cap||0)*nOff} places</span>`;else if(+s.min&&d.men<+s.min)pr='<span class="pill warn">Poca demanda per al mínim</span>';
    return`<tr class="${s.active?'':'off'}">
    <td><input type="checkbox" id="act-${s.id}" data-ch="subjActive" data-id="${s.id}" ${s.active?'checked':''} aria-label="Activa ${esc(s.name)}"></td>
    <td><input class="in" style="width:100%;min-width:160px" id="nm-${s.id}" value="${esc(s.name)}" data-ch="subjName" data-id="${s.id}" aria-label="Nom"></td>
    <td class="r num">${d.d1}</td><td class="r num">${d.top3}</td><td class="r num">${d.men}</td>
    <td><input class="in n" type="number" min="0" id="cap-${s.id}" value="${esc(s.cap)}" data-in="subjCap" data-id="${s.id}" aria-label="Places"></td>
    <td><input class="in n" type="number" min="0" id="min-${s.id}" value="${esc(s.min||0)}" data-in="subjMin" data-id="${s.id}" aria-label="Mínim"></td>
    ${N>1?`<td><div class="row" style="gap:10px;flex-wrap:nowrap">${Array.from({length:N},(_,k)=>`<label class="tchk"><input type="checkbox" id="tr-${s.id}-${k}" data-ch="subjTrim" data-id="${s.id}" data-k="${k}" ${offered(s,k)?'checked':''}>${TS[k]}</label>`).join('')}</div></td>`:''}
    ${has?`<td class="r num">${x?x.byT.map(y=>y.n).join(' · '):'–'}</td>`:''}
    <td>${pr}</td>
    <td><div class="row" style="flex-wrap:nowrap;gap:4px"><select class="in" style="width:140px" id="mg-${s.id}" data-ch="subjMerge" data-id="${s.id}" aria-label="Unificar"><option value="">Unificar amb…</option>${S.subjects.filter(o=>o.id!==s.id).map(o=>`<option value="${o.id}">${esc(o.name)}</option>`).join('')}</select><button class="btn ghost sm icon danger" data-act="subjDel" data-id="${s.id}" title="Eliminar la matèria" aria-label="Eliminar">${ic('trash')}</button></div></td></tr>`;}).join('');
  return`
  <div class="head"><div><h1>Matèries</h1><p class="lead">Defineix quantes assignacions rep cada alumne, quantes places té cada matèria i, si hi ha diversos trimestres, en quins s’ofereix. Desactiva les que no s’ofereixen: les seves tries s’ometen i les següents pugen de posició.</p></div>
  <div class="row"><a class="btn primary" href="#restriccions">Continuar ${ic('chev')}</a></div></div>

    <div class="field"><label for="defMin">Mínim per a totes</label><div class="row" style="gap:6px"><input class="in n" type="number" min="0" id="defMin" value="0"><button class="btn sm" data-act="applyMin">Aplicar</button></div></div>
  </div><button class="btn" data-act="subjAdd">${ic('plus')}Afegir matèria</button></div>
  ${N>1?`<div class="card-b" style="padding-bottom:0"><div class="note">${ic('info')}<span>Cada alumne rebrà ${N} optatives diferents, una per trimestre, i mai no en repetirà cap. Les places i el mínim són per trimestre. Desmarca els trimestres en què una matèria no s’ofereix.</span></div></div>`:''}
  <div data-live="capSummary">${LIVE.capSummary()}</div></div>

/* ---------------- Vista: Restriccions ---------------- */
VIEWS.restriccions=function(){
  if(!S.students.length)return needData();
  const st=computeStats();
  const list=st.cons.filter(c=>UI.consF==='all'||(UI.consF==='bad'?(c.st&&!c.st.ok):c.g.type===UI.consF));
  const nBad=st.cons.filter(c=>c.st&&!c.st.ok).length;
  const consSheets=S.file?S.file.order.filter(n=>n!==S.map.sheet&&isConsSheet(n)):[];
  return`
  <div class="head"><div><h1>Ajuntar i separar</h1><p class="lead">Grups d’alumnes que han de coincidir a la mateixa optativa o que no hi han de coincidir. Els obligatoris es compleixen sempre que sigui possible; els preferents es compleixen si no costen massa primeres tries.</p></div>
  <div class="row"><button class="btn" data-act="pickCons">${ic('upload')}Importar d’un fitxer</button><button class="btn primary" data-act="consNew">${ic('plus')}Nou grup</button></div></div>
  ${consSheets.length?`<div class="note">${ic('info')}<span>El fitxer carregat té ${consSheets.map(n=>`<button class="link" data-act="consSheet" data-v="${esc(n)}">«${esc(n)}»</button>`).join(', ')}. Fes-hi clic per importar-ne les restriccions.</span></div>`:''}
  ${UI.edit?consEditor():''}
  <div class="card"><div class="card-h"><div class="seg" role="group" aria-label="Filtre">${[['all','Tots',S.constraints.length],['join','Ajuntar',S.constraints.filter(c=>c.type==='join').length],['sep','Separar',S.constraints.filter(c=>c.type==='sep').length],...(st.assigned?[['bad','No complerts',nBad]]:[])].map(([k,l,n])=>`<button class="${UI.consF===k?'on':''}" data-act="consF" data-v="${k}">${l} <span class="num">${n}</span></button>`).join('')}</div>
    <div class="row small"><span class="muted">Per defecte, de l’Excel:</span>
      <label class="muted" for="jd">Ajuntar</label><select class="in" id="jd" data-ch="joinDef"><option value="soft" ${S.settings.joinDefault==='soft'?'selected':''}>Preferent</option><option value="hard" ${S.settings.joinDefault==='hard'?'selected':''}>Obligatori</option></select>
      <label class="muted" for="sd">Separar</label><select class="in" id="sd" data-ch="sepDef"><option value="soft" ${S.settings.sepDefault==='soft'?'selected':''}>Preferent</option><option value="hard" ${S.settings.sepDefault==='hard'?'selected':''}>Obligatori</option></select>
    </div></div>
  <div>${list.length?list.map(({g,st:s})=>{
    const badIds=new Set();if(s)s.bad.forEach(([a,b])=>{badIds.add(a);badIds.add(b);});
    return`<div class="cons"><div class="stack" style="gap:6px"><span class="tag ${g.type}">${ic(g.type)}${g.type==='join'?'Ajuntar':'Separar'}</span><span class="pill">${g.strength==='hard'?'Obligatori':'Preferent'}</span></div>
    <div><div class="mem">${g.members.map(id=>{const x=byId(id);if(!x)return'';const a=s?asgText(id):'';return`<span class="mchip ${badIds.has(id)?'bad':''}" title="${esc(a)}"><button class="link" style="width:auto;height:auto;border-radius:0" data-act="openSt" data-id="${id}">${esc(x.name)}</button>${a?`<span class="faint small">${esc(a)}</span>`:''}</span>`;}).join('')}</div>
    <div class="meta">${esc(g.source)}${g.note?' · '+esc(g.note):''}${s?(s.ok?(s.partial?' · <span style="color:var(--warn)">Coincideixen parcialment</span>':' · <span style="color:var(--ok)">Complert</span>'):` · <span style="color:var(--bad)">No complert: ${s.bad.length} ${s.bad.length===1?'parella':'parelles'}</span>`):''}</div></div>
    <div class="row" style="gap:4px;flex-wrap:nowrap"><button class="btn sm ghost" data-act="consToggleS" data-id="${g.id}" title="Canviar entre obligatori i preferent">${g.strength==='hard'?'Fer preferent':'Fer obligatori'}</button><button class="btn sm ghost icon" data-act="consEdit" data-id="${g.id}" title="Editar" aria-label="Editar">${ic('edit')}</button><button class="btn sm ghost icon danger" data-act="consDel" data-id="${g.id}" title="Eliminar" aria-label="Eliminar">${ic('trash')}</button></div></div>`;}).join(''):`<div class="empty"><h2>${S.constraints.length?'Cap grup en aquest filtre':'Encara no hi ha cap grup'}</h2><p>Crea un grup per indicar quins alumnes han d’anar junts o separats.</p><button class="btn primary" data-act="consNew">${ic('plus')}Nou grup</button></div>`}</div></div>`;
};
function consEditor(){
  const E=UI.edit;
  return`<div class="card" style="border-color:var(--accent)"><div class="card-h"><h2>${E.id?'Editar grup':'Nou grup'}</h2>

  </div></div>
  <div class="card"><div class="card-h"><div><h2>Equilibri de les optatives</h2><p>Fa que la composició de cada optativa${N>1?' i trimestre':''} s’assembli a la del conjunt de l’alumnat</p></div></div>
  ${S.criteria.length?S.criteria.map(c=>{const cats=critCats(c.key);const lv=+(set.balance[c.key]||0);return`<div class="crit-row"><b>${esc(c.label)}</b><div class="dist" style="margin:0">${cats.slice(0,6).map(([v,n])=>`<span>${esc(v)}<b>${n}</b></span>`).join('')}${cats.length>6?`<span>+${cats.length-6}</span>`:''}</div>
