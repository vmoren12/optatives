/* ---------------- Vista: Assignació ---------------- */
function summaryStrip(st){
  const N=st.N;
  const cells=N===1?[
    ['ok',fmtPct(st.has1,st.nStud),'amb la 1a opció'],
    ['',fmtPct(st.allTop3,st.nStud),'entre les 3 primeres']
  ]:[
    ['ok',fmtPct(st.has12,st.nStud),'amb la 1a o 2a tria en algun trimestre'],
    ['',fmtPct(st.has1,st.nStud),'amb la 1a tria en algun trimestre']
  ];
  return`<div class="strip">${cells.map(([c,v,k])=>`<div><span class="v ${c}">${v}</span><span class="k">${k}</span></div>`).join('')}
  <div><span class="v">${st.meanR?fmt1(st.meanR):'–'}</span><span class="k">posició mitjana</span></div>
  <div><span class="v ${st.out?'warn':''}">${st.out}</span><span class="k">matèries no triades</span></div>
  <div><span class="v ${st.unStud?'bad':''}">${st.unStud}</span><span class="k">alumnes ${N>1?'amb trimestres ':''}sense assignar</span></div>
  <div><span class="v ${st.cons.length&&st.consOk<st.cons.length?'warn':''}">${st.cons.length?st.consOk+'/'+st.cons.length:'–'}</span><span class="k">restriccions complertes</span></div></div>`;
}
VIEWS.assignacio=function(){
  if(!S.students.length)return needData();
  const st=computeStats();const N=st.N;if(UI.trim>=N)UI.trim=0;
  const top=`<div class="head"><div><h1>Assignació</h1><p class="lead">${st.assigned?'Arrossega els alumnes d’una matèria a una altra o obre’n la fitxa per veure alternatives. Els alumnes fixats no es mouen en els recàlculs.':'Calcula una primera proposta. Després la podràs ajustar a mà tant com vulguis.'}</p></div>
  <div class="row">
    <button class="btn ghost icon" data-act="undo" title="Desfer" aria-label="Desfer" ${HIST.length?'':'disabled'}>${ic('undo')}</button>
    <button class="btn ghost icon" data-act="redo" title="Refer" aria-label="Refer" ${FUT.length?'':'disabled'}>${ic('redo')}</button>
    ${st.assigned?`<button class="btn" data-act="runImprove" title="Busca millores sense canviar gaire la proposta actual">${ic('spark')}Millorar l’actual</button>`:''}
    <button class="btn primary" data-act="runFull">${ic('play')}${st.assigned?'Recalcular':'Assignar automàticament'}</button></div></div>`;
  if(!st.assigned)return top+`<div class="card"><div class="empty"><h2>Encara no hi ha cap assignació</h2><p>${S.students.length} alumnes · ${activeSubs().length} matèries actives · ${N===1?'una assignació':N+' trimestres'} · estratègia «${STRATS[S.settings.strategy]?.label||'Personalitzada'}»</p><button class="btn primary" data-act="runFull">${ic('play')}Assignar automàticament</button></div></div>`;
  const grups=S.criteria.find(c=>c.key==='grup')?critCats('grup').map(c=>c[0]):[];
  const fopts=[['all','Tots els alumnes'],['r1',N===1?'Amb la 1a opció':'Amb la 1a tria en algun trimestre'],...(N>1?[['no12','Sense la 1a ni la 2a tria']]:[]),['r2',N===1?'2a opció o més avall':`Alguna fora de les ${N} primeres`],['r3',N===1?'3a opció o més avall':`Alguna fora de les ${N+1} primeres`],['out','Matèria no triada'],['un','Sense assignar'],['viol','Restricció no complerta'],['lock','Fixats']];
  return top+summaryStrip(st)+`
  <div class="toolbar">
    <div class="seg" role="group" aria-label="Vista"><button class="${UI.asgView==='board'?'on':''}" data-act="asgView" data-v="board">Per matèria</button><button class="${UI.asgView==='table'?'on':''}" data-act="asgView" data-v="table">Per alumne</button></div>
    ${N>1&&UI.asgView==='board'?`<div class="seg" role="group" aria-label="Trimestre">${Array.from({length:N},(_,k)=>`<button class="${UI.trim===k?'on':''}" data-act="trim" data-v="${k}">${TL[k]}${st.unT[k]?` <span class="flag bad" style="display:inline-grid;margin-left:4px">${st.unT[k]}</span>`:''}</button>`).join('')}</div>`:''}
    <div class="search">${ic('search')}<input class="in" id="asgQ" data-in="asgQ" placeholder="Cercar alumne" value="${esc(UI.q)}" autocomplete="off"></div>
    <select class="in" id="asgF" data-ch="asgF" aria-label="Filtre">${fopts.map(([k,l])=>`<option value="${k}" ${UI.filt===k?'selected':''}>${l}</option>`).join('')}</select>
    ${grups.length?`<select class="in" id="asgG" data-ch="asgG" aria-label="Grup"><option value="">Tots els grups</option>${grups.map(g=>`<option ${UI.grupF===g?'selected':''}>${esc(g)}</option>`).join('')}</select>`:''}
    <span class="sp"></span>
    <span class="hint" id="lockHint">${lockHintHTML()}</span>
  </div>
  <div id="asgBody">${UI.asgView==='board'?boardHTML(st):tableHTML(st)}</div>`;
};
function passFilter(s,st){
  const p=st.per[s.id];if(!p)return false;
  if(UI.q&&!norm(s.name).includes(norm(UI.q)))return false;
  if(UI.grupF&&s.attrs.grup!==UI.grupF)return false;
  const f=UI.filt,N=st.N;
  if(f==='r1')return p.h1;
  if(f==='no12')return !p.h12;
  if(f==='r2')return p.miss>0||p.ranks.some(r=>r!==null&&(r<0||r>=N));
  if(f==='r3')return p.miss>0||p.ranks.some(r=>r!==null&&(r<0||r>=N+1));
  if(f==='out')return p.ranks.some(r=>r!==null&&r<0);
  if(f==='un')return p.miss>0;
  if(f==='viol')return st.viol.has(s.id);
  if(f==='lock')return !!S.locked[s.id];
  return true;
}
function chipHTML(s,subId,k,st){
  const r=subId?rankOf(s.id,subId):null;const p=st.per[s.id];
  const g=s.attrs.grup||'';const no12=st.N>1&&!p.h12;
  const others=st.N>1?p.a.map((x,kk)=>kk!==k&&x?`${TS[kk]}: ${subj(x).name}`:'').filter(Boolean).join(' · '):'';
  return`<div class="chip ${st.viol.has(s.id)?'viol':''}" draggable="true" data-drag="${s.id}" data-from="${subId||''}" data-k="${k}" data-act="openSt" data-id="${s.id}" title="${esc(s.name)} · ${rankTxt(r)}${others?' · '+esc(others):''}${no12?' · sense la 1a ni la 2a tria':''}${st.viol.has(s.id)?' · restricció no complerta':''}">${rk(r)}<span class="nm">${esc(s.name)}</span>${no12?'<span class="pill warn" style="height:18px;padding:0 5px" aria-label="Sense 1a ni 2a tria">!</span>':''}${g?`<span class="gp">${esc(g)}</span>`:''}${lockBtn(s.id)}</div>`;
}
function lockBtn(id){const L=!!S.locked[id];return`<button class="lk ${L?'on':''}" data-act="lock" data-id="${id}" title="${L?'Fixat al seu grup: no es mourà en recalcular. Clic per desfixar.':'Fixar en aquest grup per a les properes assignacions'}" aria-label="${L?'Desfixar':'Fixar'}" aria-pressed="${L}">${ic(L?'lock':'unlock')}</button>`;}
function lockHintHTML(){const nLock=Object.values(S.locked).filter(Boolean).length;return nLock?`${pl(nLock,'alumne fixat','alumnes fixats')} · <button class="link" data-act="unlockAll">Desfixar-los tots</button>`:'Cap alumne fixat · <button class="link" data-act="lockAll">Fixar-los tots</button>';}
function updateLockUI(id){
  $$(`.lk[data-id="${id}"]`).forEach(b=>{b.outerHTML=lockBtn(id);});
  $$(`.tbl [data-act="lock"][data-id="${id}"]`).forEach(b=>{const L=!!S.locked[id];b.innerHTML=ic(L?'lock':'unlock');b.title=L?'Fixat: no es mourà en recalcular. Clic per desfixar.':'Fixar: no es mourà en recalcular';});
  const h=$('#lockHint');if(h)h.innerHTML=lockHintHTML();
  $$('[data-act="lockGroup"]').forEach(b=>{const st=computeStats();const mem=st.sub[b.dataset.sub]?.byT[+b.dataset.k]?.members||[];const all=mem.length&&mem.every(x=>S.locked[x]);b.classList.toggle('on',!!all);b.innerHTML=ic(all?'lock':'unlock');});
}
function prefBlock(members,subId){
  const n=members.length;if(!n)return'';
  const c=new Map();members.forEach(id=>{const r=rankOf(id,subId);const key=r<0?-1:Math.min(r,4);c.set(key,(c.get(key)||0)+1);});
  const keys=[0,1,2,3,4,-1].filter(k=>c.has(k));
  return`<div class="pref" aria-label="Alumnes per preferència">${keys.map(k=>`<span title="${k<0?'Matèria no triada':k===4?'5a opció o més avall':(k+1)+'a opció'}: ${c.get(k)} ${c.get(k)===1?'alumne':'alumnes'} (${fmtPct(c.get(k),n)})">${rk(k<0?-1:k)}<b>${c.get(k)}</b><em>${Math.round(c.get(k)*100/n)}%</em></span>`).join('')}</div>`;
}
function boardHTML(st){
  const k=Math.min(UI.trim,st.N-1);
  const bc=S.criteria.filter(c=>+S.settings.balance[c.key]>0);const pals=bc.map(c=>({c,p:critPalette(c.key)}));
  const fset=new Set(S.students.filter(s=>passFilter(s,st)).map(s=>s.id));
  const sortM=(ids,sub)=>ids.filter(id=>fset.has(id)).map(byId).sort((a,b)=>{const ra=rankOf(a.id,sub),rb=rankOf(b.id,sub);return(ra<0?99:ra)-(rb<0?99:rb)||a.name.localeCompare(b.name,'ca');});
  const cards=st.subs.filter(s=>offered(s,k)).map(s=>{const x=st.sub[s.id].byT[k];const cap=+s.cap||0;const n=x.n;const w=cap?Math.min(100,n*100/cap):0;const mn=+s.min||0;
    const cls=n>cap?'over':n===cap?'full':'';const mem=sortM(x.members,s.id);
    return`<section class="scard" data-drop="${s.id}" aria-label="${esc(s.name)}"><div class="sc-h"><div class="sc-t"><h3>${esc(s.name)}</h3><span class="row" style="gap:6px;flex-wrap:nowrap"><span class="sc-c"><b>${n}</b><span class="faint">/${cap}</span></span>${x.members.length?(()=>{const all=x.members.every(id=>S.locked[id]);return`<button class="lk grp ${all?'on':''}" data-act="lockGroup" data-sub="${s.id}" data-k="${k}" title="${all?'Desfixar tot el grup':'Fixar tots els alumnes d’aquest grup'}" aria-label="${all?'Desfixar tot el grup':'Fixar tot el grup'}">${ic(all?'lock':'unlock')}</button>`;})():''}</span></div>
    <div class="bar" title="${n} de ${cap} places${mn?` · mínim ${mn}`:''}"><i class="${cls}" style="width:${w}%"></i>${mn&&cap?`<b style="left:${Math.min(100,mn*100/cap)}%"></b>`:''}</div>
    ${prefBlock(x.members,s.id)}
    ${n>cap?`<span class="pill bad">${ic('alert')}Supera la capacitat</span>`:mn&&n<mn?`<span class="pill warn">${ic('alert')}Per sota del mínim (${mn})</span>`:''}
    ${pals.map(({c,p})=>`<div class="comp"><div class="cl"><span>${esc(c.label)}</span><span>desajust ${fmt1(desajust(x.members,c.key))}</span></div>${sbar(x.members,c.key,p,s.name+(st.N>1?' · '+TL[k]:''))}</div>`).join('')}
    </div><div class="sc-b">${mem.length?mem.map(m=>chipHTML(m,s.id,k,st)).join(''):`<div class="sc-empty">${x.members.length?'Cap alumne amb aquest filtre':'Arrossega alumnes aquí'}</div>`}</div></section>`;}).join('');
  const un=S.students.filter(s=>!st.per[s.id].a[k]&&fset.has(s.id));
  const unCard=st.unT[k]?`<section class="scard unas" data-drop="__none"><div class="sc-h"><div class="sc-t"><h3>Sense assignar</h3><span class="sc-c"><b>${st.unT[k]}</b></span></div><p class="hint">Arrossega’ls a una matèria o obre’n la fitxa.</p></div><div class="sc-b">${un.map(m=>chipHTML(m,null,k,st)).join('')||'<div class="sc-empty">Cap alumne amb aquest filtre</div>'}</div></section>`:'';
  const leg=`<div class="legend"><span>Opció rebuda:</span>${[0,1,2,3].map(r=>`<span>${rk(r)}${r+1}a</span>`).join('')}<span>${rk(4)}5a o més</span><span>${rk(-1)}No triada</span>${st.N>1?'<span><span class="pill warn" style="height:18px;padding:0 5px">!</span>Sense 1a ni 2a tria</span>':''}<span>${ic('lock')}Fixat: no es mou en recalcular</span>${pals.map(({c,p})=>`<span style="margin-left:10px;color:var(--ink);font-weight:600">${esc(c.label)}:</span>${p.top.map(v=>`<span><i class="sw" style="background:${p.col(v)}"></i>${esc(v)}</span>`).join('')}`).join('')}</div>`;
  const note=st.N>1?`<p class="hint">Mostrant el ${TL[k]}. Si arrossegues un alumne a una matèria que ja té en un altre trimestre, les dues s’intercanvien.</p>`:'';
  return`<div class="stack">${leg}${note}<div class="board">${unCard}${cards}</div></div>`;

function balanceRows(st){
  const N=st.N;
  return S.criteria.map(c=>{
    const lv=+(S.settings.balance[c.key]||0);
    const perT=Array.from({length:N},(_,k)=>{const ds=st.subs.filter(s=>offered(s,k)&&st.sub[s.id].byT[k].n).map(s=>({s,v:desajust(st.sub[s.id].byT[k].members,c.key)}));return ds;});
    const all=perT.flatMap((d,k)=>d.map(x=>({...x,k})));
    const mean=d=>d.length?d.reduce((a,b)=>a+b.v,0)/d.length:0;
    const mx=all.reduce((a,b)=>b.v>(a?a.v:-1)?b:a,null);
    return{c,lv,perT:perT.map(mean),mean:mean(all),max:mx};
  });
}

function manualAssign(sid,k,to){
  const N=periods();if(!(k>=0&&k<N))k=0;
  const a=slotsOf(sid);const prev=a[k];let msg='';
  if(to){const t=subj(to);if(!t)return;
    if(!offered(t,k)){toast(`«${t.name}» no s’ofereix al ${TL[k]}.`,'bad');return;}
    pushHist();
    const k2=a.indexOf(to);
    if(k2>=0&&k2!==k){a[k2]=prev&&offered(subj(prev),k2)?prev:null;msg=prev&&a[k2]?` S’ha intercanviat amb el ${TL[k2]}.`:` S’ha tret del ${TL[k2]}.`;}
    a[k]=to;
  }else{pushHist();a[k]=null;}
  S.asg[sid]=a;
  if(S.settings.autoLock&&a.some(Boolean))S.locked[sid]=true;
  persist();STATS=null;const st=computeStats();
  if(to){const x=st.sub[to].byT[k];const sb=subj(to);if(x.n>(+sb.cap||0))msg=`«${sb.name}» supera la capacitat${N>1?' al '+TL[k]:''} (${x.n}/${sb.cap}).`+msg;}
  if(msg)toast(msg.trim());
  render();refreshDrawer();
}

  if(perSt){
    const hdr=rows[hr];const roles=hdr.map(guessRole);const ni=roles.map((r,i)=>r==='nom'||r==='cognoms'?i:-1).filter(i=>i>=0);
    const entries=[];
    for(let r=hr+1;r<rows.length;r++){const row=rows[r];if(!row||!row.some(Boolean))continue;const name=ni.map(i=>row[i]).filter(Boolean).join(' ');const res=resolveName(norm(name),idx);
      if(!res.ids.length||res.ids.length>1){miss++;add({title:`Alumne no trobat al fitxer de restriccions: «${name}»`,detail:`Fila ${r+1}.`});continue;}
      entries.push({sid:res.ids[0],row:r+1,jr:roles.map((x,i)=>x==='ajuntar'?row[i]:'').filter(Boolean),sr:roles.map((x,i)=>x==='separar'?row[i]:'').filter(Boolean)});}
    S.constraints=dedupeCons([...S.constraints,...resolveRefs(entries,'Fitxer',add)]);
  }else{
    const hdrRow=rows[hr]||[];const start=(typeI>=0||hdrRow.some(c=>guessRole(c)!=='ignorar'))?hr+1:hr;
    for(let r=start;r<rows.length;r++){const row=rows[r];if(!row||!row.some(Boolean))continue;
      let type=UI.cf.defType;const cells=[];
      row.forEach((c,i)=>{if(!c)return;const n=norm(c);if(i===typeI||/^(ajuntar|juntar|junts|separar|separats|separ)$/.test(n)){if(/separ/.test(n))type='sep';else if(/junt|ajunt/.test(n))type='join';return;}cells.push(c);});
      const mem=[];cells.forEach(c=>splitCell(c,idx).forEach(v=>{const res=resolveName(norm(v),idx);if(res.ids.length===1)mem.push(res.ids[0]);else{miss++;const sg=res.sug?byId(res.sug):null;add({title:`«${v}» no correspon a cap alumne`,detail:`Fitxer de restriccions, fila ${r+1}.`+(res.ids.length>1?' Coincideix amb diversos alumnes.':sg?` Potser vols dir «${sg.name}».`:'')});}}));
      const u=[...new Set(mem)];if(u.length>=2)S.constraints.push({id:uid(),type,strength:type==='join'?S.settings.joinDefault:S.settings.sepDefault,members:u,source:'Fitxer',note:`Fila ${r+1}`});}
    S.constraints=dedupeCons(S.constraints);
  }
  persist();render();
  toast(`S’han importat ${pl(S.constraints.length-before,'grup','grups')}.${miss?` ${pl(miss,'nom no s’ha','noms no s’han')} pogut identificar (vegeu Revisió).`:''}`);
}

  XLSX.utils.book_append_sheet(wb,sheetFrom([head,...rows],[28,...S.criteria.map(()=>14),...Array(N*2).fill(18),...(N>1?[12]:[]),8,10,...Array(mc).fill(18)]),'Assignació');
  // 2. Llistes en columnes, per trimestre
  const la=[];
  for(let k=0;k<N;k++){
    const subs=st.subs.filter(s=>offered(s,k));
    const cols=subs.map(s=>st.sub[s.id].byT[k].members.map(byId).sort(byName).map(x=>x.name));

    for(let r=0;r<maxL;r++)la.push(cols.map(c=>c[r]||''));
  }
  XLSX.utils.book_append_sheet(wb,sheetFrom(la,Array(Math.max(1,st.subs.length)).fill(28)),'Llistes');
  // 3. Per matèria (files)
  const pm=[[...(N>1?['Trimestre']:[]),'Matèria','Alumne',...S.criteria.map(c=>c.label),'Opció']];
  for(let k=0;k<N;k++)st.subs.filter(s=>offered(s,k)).forEach(s=>st.sub[s.id].byT[k].members.map(byId).sort(byName).forEach(x=>pm.push([...(N>1?[TL[k]]:[]),s.name,x.name,...S.criteria.map(c=>x.attrs[c.key]||''),optCell(x.id,s.id)])));
  XLSX.utils.book_append_sheet(wb,sheetFrom(pm,[...(N>1?[14]:[]),24,28,...S.criteria.map(()=>14),10]),'Per matèria');
  // 4. Resum, garantia i equilibri
  const mcH=Math.max(1,Math.min(8,mc));
  const rs=[['Resum de l’assignació'],[S.project||''],[N===1?'Una assignació per alumne':`${N} trimestres: una optativa diferent per trimestre, sense repeticions`],[],['Alumnes',n]];
  if(N===1)rs.push(['Amb la 1a opció',st.has1,fmtPct(st.has1,n)],['Entre les 3 primeres',st.allTop3,fmtPct(st.allTop3,n)]);
  else rs.push(['Amb la 1a o 2a tria en algun trimestre',st.has12,fmtPct(st.has12,n)],['Amb la 1a tria en algun trimestre',st.has1,fmtPct(st.has1,n)],[`Totes dins les ${N+2} primeres`,st.allTop3,fmtPct(st.allTop3,n)],['Garantia 1a o 2a tria',S.settings.top2?(+S.settings.top2W>=1000?'Obligatòria':'Preferent'):'No activada']);
  rs.push(['Posició mitjana',Math.round(st.meanR*100)/100],['Matèries no triades assignades',st.out],['Alumnes sense assignar',st.unStud],['Restriccions complertes',`${st.consOk}/${st.cons.length}`],[]);
  rs.push(['Opció rebuda',...(N>1?TS.slice(0,N):[]),'Total']);
  for(let r=0;r<mcH;r++)rs.push([`${r+1}a opció`,...(N>1?st.histT.map(h=>h[r]||0):[]),st.hist[r]||0]);
  rs.push(['No triada',...(N>1?st.outT:[]),st.out],['Sense assignar',...(N>1?st.unT:[]),st.unSlots],[]);
  if(S.criteria.length){
    const bal=balanceRows(st);
    rs.push(['Equilibri (desajust: alumnes que caldria moure perquè cada grup tingués la proporció del total)'],['Criteri','Equilibri aplicat',...(N>1?TS.slice(0,N).map(t=>'Desajust '+t):[]),'Desajust mitjà','Grup més desajustat','Desajust màxim']);
    bal.forEach(b=>rs.push([b.c.label,BAL[b.lv].l,...(N>1?b.perT.map(v=>Math.round(v*10)/10):[]),Math.round(b.mean*10)/10,b.max?b.max.s.name+(N>1?' · '+TS[b.max.k]:''):'',b.max?Math.round(b.max.v*10)/10:'']));
    rs.push([]);
  }
  const cats=S.criteria.flatMap(c=>critCats(c.key).slice(0,6).map(([v])=>({c,v})));
  rs.push([...(N>1?['Trimestre']:[]),'Matèria','Alumnes','Places','Mínim','Amb 1a tria',...(N===1?['Demanda 1a tria']:[]),...cats.map(x=>`${x.c.label}: ${x.v}`),...S.criteria.map(c=>`Desajust ${c.label}`)]);
  for(let k=0;k<N;k++)st.subs.filter(s=>offered(s,k)).forEach(s=>{const x=st.sub[s.id].byT[k];rs.push([...(N>1?[TL[k]]:[]),s.name,x.n,+s.cap||0,+s.min||0,x.first,...(N===1?[st.sub[s.id].dem1]:[]),...cats.map(cv=>x.members.filter(id=>byId(id).attrs[cv.c.key]===cv.v).length),...S.criteria.map(c=>Math.round(desajust(x.members,c.key)*10)/10)]);});
  rs.push([],['Estratègia',STRATS[S.settings.strategy]?.label||'Personalitzada'],['Punts per opció',S.settings.costs.join(' · ')],['Equilibri',S.criteria.map(c=>`${c.label}: ${BAL[+S.settings.balance[c.key]||0].l}`).join(' · ')||'–']);
  XLSX.utils.book_append_sheet(wb,sheetFrom(rs,[34,16,12,12,12,16,18,14,14,14]),'Resum');
  if(N>1){const no=S.students.filter(s=>!st.per[s.id].h12).sort(byName);if(no.length){const g=[['Alumnes sense la 1a ni la 2a tria en cap trimestre'],['Alumne',...S.criteria.map(c=>c.label),'1a tria','2a tria',...TL.slice(0,N)]];no.forEach(s=>{const p=st.per[s.id];g.push([s.name,...S.criteria.map(c=>s.attrs[c.key]||''),subj(s.choices[0])?.name||'',subj(s.choices[1])?.name||'',...p.a.map(id=>id?subj(id).name:'')]);});XLSX.utils.book_append_sheet(wb,sheetFrom(g,[28,...S.criteria.map(()=>14),18,18,...Array(N).fill(18)]),'Sense 1a o 2a');}}
  if(S.constraints.length){const rc=[['Tipus','Força','Origen','Estat','Alumnes','Assignacions','Nota']];st.cons.forEach(({g,st:cs})=>rc.push([g.type==='join'?'Ajuntar':'Separar',g.strength==='hard'?'Obligatori':'Preferent',g.source,cs?(cs.ok?(cs.partial?'Parcial':'Complert'):'No complert'):'',g.members.map(id=>byId(id)?.name).filter(Boolean).join('; '),g.members.map(id=>byId(id)?byId(id).name.split(' ')[0]+': '+asgText(id):'').filter(Boolean).join(' | '),g.note||'']));XLSX.utils.book_append_sheet(wb,sheetFrom(rc,[10,12,10,12,50,60,30]),'Restriccions');}
  const out=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  saveFile(`${safeName()}-assignacio-${fileStamp()}.xlsx`,new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
}

function demoRows(){
  let seed=20261118;const rnd=()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646;};const pick=a=>a[Math.floor(rnd()*a.length)];
  const F=['Aina','Laia','Júlia','Martina','Paula','Clàudia','Ona','Carla','Mariona','Berta','Nora','Emma','Abril','Lucía','Noa','Sara','Alba','Jana','Íria','Queralt','Fàtima','Sofia','Mar','Txell','Gemma','Núria'];
  const Mn=['Marc','Pau','Pol','Jan','Àlex','Biel','Arnau','Oriol','Nil','Martí','Hugo','Adrià','Joel','Eric','Gerard','Iker','Roger','Unai','Bilal','Dani','Leo','Ot','Quim','Max','Sergi','Hamza'];
  const C=['Puig','Ferrer','Soler','Vila','Serra','Roca','Font','Pujol','Casals','Riera','Vidal','Bosch','Mas','Sala','Martí','Camps','Ribas','Prat','Costa','Torres','García','López','Martínez','Sánchez','Rodríguez','Fernández','El Amrani','Chen','Moreno','Ortiz','Navarro','Gil'];
  const SUB=[['Robòtica',[9,4]],['Teatre',[3,8]],['Música i producció',[6,6]],['Francès',[2,4]],['Emprenedoria',[4,3]],['Arts plàstiques',[3,6]],['Ciència experimental',[5,4]]];
  const ESC=['Escola Can Rull','Escola Els Pins','Escola La Serra','Escola Sant Oleguer'];
  const out=[['Nom','Cognoms','Grup','Escoleta','Gènere','Nivell','Tria 1','Tria 2','Tria 3','Tria 4','Tria 5','Ajuntar','Separar']];
  const used=new Set();const st=[];
  ['Grup A','Grup B','Grup C'].forEach(g=>{for(let i=0;i<30;i++){const girl=rnd()<.5;let nom,cog;do{nom=pick(girl?F:Mn);cog=pick(C)+' '+pick(C);}while(used.has(nom+cog));used.add(nom+cog);
    const lv=rnd();const niv=lv<.3?'Alt':lv<.75?'Mitjà':'Baix';
    const pool=SUB.map(([n,w])=>[n,w[girl?1:0]*(0.6+rnd())]);const ch=[];for(let k=0;k<5;k++){const tot=pool.reduce((a,b)=>a+b[1],0);let x=rnd()*tot;let idx=0;for(;idx<pool.length;idx++){x-=pool[idx][1];if(x<=0)break;}idx=Math.min(idx,pool.length-1);ch.push(pool[idx][0]);pool.splice(idx,1);}
    st.push({nom,cog,g,esc:pick(ESC),gen:girl?'Noia':'Noi',niv,ch,aj:'',se:''});}});
  const full=s=>s.nom+' '+s.cog;
  // amistats dins el grup
  for(let k=0;k<12;k++){const a=st[Math.floor(rnd()*st.length)];const cands=st.filter(b=>b!==a&&b.g===a.g&&!b.aj);const b=pick(cands);if(!a.aj)a.aj=full(b);}
  // codi compartit
  [st[5],st[37],st[70]].forEach(s=>s.aj='G1');
  // separacions
  for(let k=0;k<6;k++){const a=st[Math.floor(rnd()*st.length)];const b=pick(st.filter(x=>x!==a&&x.g===a.g));if(!a.se)a.se=full(b);}
  // errors intencionats per mostrar la revisió
  st[3].ch[0]='Robotica';st[18].ch[1]='robòtica ';st[44].ch[2]='teatre';st[61].ch[0]='Musica i produccio';st[77].ch[1]='Ciencia experimental';
  st[12].ch[3]=st[12].ch[0];
  st[25].ch=['','','','',''];
  st[33].ch[1]='';
  st[50].gen='noia';st[66].gen='H';
  st[8].aj=st[9].nom+' '+st[9].cog.slice(0,-1);
  st[14].aj=st[15].nom;
  st[40].aj='Pere Inventat Prou';
  st[52].aj=full(st[53]);st[53].se=full(st[52]);
  st[88].nom=st[87].nom;st[88].cog=st[87].cog;
  st.forEach(s=>out.push([s.nom,s.cog,s.g,s.esc,s.gen,s.niv,...s.ch,s.aj,s.se]));
  out.splice(47,0,['','','','','','','','','','','','','']);
  return out;
}

let MODAL=null;

function closeModal(){$('#modalHost').innerHTML='';MODAL=null;}
$('#modalHost').addEventListener('click',e=>{const b=e.target.closest('[data-mo]');if(b){const o=MODAL;closeModal();if(b.dataset.mo==='ok'&&o&&o.onOk)o.onOk();return;}if(e.target.hasAttribute('data-modal-back'))closeModal();});
function toast(msg,kind){const t=document.createElement('div');t.className='toast '+(kind||'');t.textContent=msg;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),kind==='bad'?6500:4200);}
function showBusy(label){$('#busyHost').innerHTML=`<div class="busy" role="status"><div><b>${esc(label)}…</b><div class="bar"><i id="busyBar" style="width:2%"></i></div><span class="hint">Es busca la combinació amb menys penalització respectant les places.</span></div></div>`;}

function hideBusy(){$('#busyHost').innerHTML='';}

})();
